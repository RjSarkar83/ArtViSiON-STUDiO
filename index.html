function libShape(name,cx,cy,size){
  const P=[];const push=(x,y)=>P.push({p:{x:cx+x,y:cy+y},in:null,out:null});
  const S=size;
  if(name==='arrow'){
    const w=S,h=S*0.62,sh=h*0.42,hw=w*0.62;
    [[-hw,-sh/2],[hw/2-w/2,-sh/2],[hw/2-w/2,-h/2],[w/2,0],[hw/2-w/2,h/2],[hw/2-w/2,sh/2],[-hw,sh/2],[-hw,-sh/2]].forEach(pt=>push(pt[0],pt[1]))}
  else if(name==='heart'){
    for(let i=0;i<=48;i++){const t=i/48*TAU;
      const x=16*Math.pow(Math.sin(t),3);
      const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      push(x*S/34,y*S/34)}}
  else if(name==='bubble'){
    const w=S,h=S*0.7,r=S*0.14;
    const pts=[];const cor=8;
    const corner=(cx2,cy2,a0)=>{for(let i=0;i<=cor;i++){const a=a0+i/cor*(Math.PI/2);pts.push([cx2+Math.cos(a)*r,cy2+Math.sin(a)*r])}};
    corner(-w/2+r,-h/2+r,Math.PI);corner(w/2-r,-h/2+r,-Math.PI/2);corner(w/2-r,h/2-r,0);
    pts.push([0,h/2]);pts.push([-w*0.2,h/2+r*0.9]);
    corner(-w/2+r,h/2-r,Math.PI/2);
    pts.forEach(pt=>push(pt[0],pt[1]))}
  else if(name==='badge'){
    const n=14;
    for(let i=0;i<=n*2;i++){const a=i/(n*2)*TAU;
      const r=S/2*(1+(i%2?0.09:-0.02));
      push(Math.cos(a)*r,Math.sin(a)*r)}}
  else if(name==='diamond'){
    [[0,-S/2],[S/2,0],[0,S/2],[-S/2,0],[0,-S/2]].forEach(pt=>push(pt[0],pt[1]))}
  else if(name==='cross'){
    const a=S*0.16,b=S/2;
    [[-a,-b],[a,-b],[a,-a],[b,-a],[b,a],[a,a],[a,b],[-a,b],[-a,a],[-b,a],[-b,-a],[-a,-a],[-a,-b]].forEach(pt=>push(pt[0],pt[1]))}
  else if(name==='bolt'){
    [[S*0.1,-S/2],[-S*0.3,S*0.08],[-S*0.02,S*0.08],[-S*0.12,S/2],[S*0.3,-S*0.06],[S*0.02,-S*0.06],[S*0.1,-S/2]].forEach(pt=>push(pt[0],pt[1]))}
  else return null;
  return[{nodes:P,closed:true}]}

function stepRepeat(n,dx,dy,rot,sc){
  pushUndo();
  const L=activeLayer();
  const clones=[];
  for(const s of selShapes){
    const b=shapeBBoxDoc(s);
    const c0={x:(b.x+b.x2)/2,y:(b.y+b.y2)/2};
    for(let i=1;i<n;i++){
      const c=JSON.parse(JSON.stringify(s,(k,v)=>k[0]==='_'?undefined:v));
      c.id=uid();c._dirty=true;
      const cc={x:c0.x+dx*i,y:c0.y+dy*i};

      if(sc!==1)m=M.mul(M.tScaleAbout(cc.x,cc.y,Math.pow(sc,i),Math.pow(sc,i)),m);
      c.t=M.mul(m,s.t||M.id());

/* ---------- mask blur (feather) ---------- */
function blurMask(m,W,H,r){
  if(r<=0)return m;
  const a=new Float32Array(W*H);
  for(let i=0;i<m.length;i++)a[i]=m[i]/255;
  const b=new Float32Array(W*H);
  const w2=r*2+1;
  for(let y=0;y<H;y++){const row=y*W;let sum=0;
    for(let x=-r;x<=r;x++)sum+=a[row+clamp(x,0,W-1)];
    for(let x=0;x<W;x++){b[row+x]=sum/w2;
      sum+=a[row+clamp(x+r+1,0,W-1)]-a[row+clamp(x-r,0,W-1)]}}
  const out=new Float32Array(W*H);
  for(let x=0;x<W;x++){let sum=0;
    for(let y=-r;y<=r;y++)sum+=b[clamp(y,0,H-1)*W+x];
    for(let y=0;y<H;y++){out[y*W+x]=sum/w2;
      sum+=b[clamp(y+r+1,0,H-1)*W+x]-b[clamp(y-r,0,H-1)*W+x]}}
  const res=new Uint8Array(W*H);
  for(let i=0;i<res.length;i++)res[i]=Math.round(clamp(out[i],0,1)*255);
  return res}
function removeByMask(L,mask,feather){
  const g=L.canvas.getContext('2d');
  const img=g.getImageData(0,0,doc.w,doc.h);
  const norm=new Uint8Array(mask.length);
  for(let i=0;i<mask.length;i++)norm[i]=mask[i]?255:0;
  const soft=blurMask(norm,doc.w,doc.h,Math.max(0,feather|0));
  for(let i=0;i<soft.length;i++){
    const k=soft[i]/255;
    if(k>0)img.data[i*4+3]=img.data[i*4+3]*(1-k)}
  g.putImageData(img,0,0);
  layerVerBump(L);docDirty=true;needRender=true;uiLayersRefresh()}

/* ---------- background erase core ---------- */
function bgMaskAt(L,p,tol){
  bakeOffset(L);
  const x0=Math.floor(p.x-L.offset.x),y0=Math.floor(p.y-L.offset.y);
  if(x0<0||y0<0||x0>=doc.w||y0>=doc.h)return null;
  const px=L.canvas.getContext('2d').getImageData(0,0,doc.w,doc.h).data;
  const si=(y0*doc.w+x0)*4;
  if(px[si+3]<8){toast('Wahan koi color nahi (transparent)');return null}
  const tol2=tol*tol*3*1.44;
  const R=px[si],Gg=px[si+1],B=px[si+2];
  const match=i=>{const dr=px[i]-R,dg=px[i+1]-Gg,db=px[i+2]-B;
    return dr*dr+dg*dg+db*db<=tol2&&px[i+3]>=8};
  let mask;
  if(opts.bgGlobal){
    mask=new Uint8Array(doc.w*doc.h);
    for(let i=0;i<mask.length;i++)if(match(i*4))mask[i]=255}
  else mask=floodScan(px,doc.w,doc.h,x0,y0,match);
  if(pixSel)for(let i=0;i<mask.length;i++)if(!pixSel.mask[i])mask[i]=0;
  return mask}
function bgRemoveAt(L,p){
  const mask=bgMaskAt(L,p,opts.bgTol);
  if(!mask)return;
  removeByMask(L,mask,opts.bgFeather)}
function bgRemoveAuto(){
  const L=activeRasterForFilter(true);if(!L)return;
  bakeOffset(L);
  pushUndo();
  const px=L.canvas.getContext('2d').getImageData(0,0,doc.w,doc.h).data;
  const W=doc.w,H=doc.h;
  const cornerAvg=(cx,cy)=>{
    let r=0,gg=0,b=0,a=0,n=0;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const x=clamp(cx+dx,0,W-1),y=clamp(cy+dy,0,H-1);
      const i=(y*W+x)*4;r+=px[i];gg+=px[i+1];b+=px[i+2];a+=px[i+3];n++}
    return{r:r/n,g:gg/n,b:b/n,a:a/n}};
  const corners=[cornerAvg(3,3),cornerAvg(W-4,3),cornerAvg(3,H-4),cornerAvg(W-4,H-4)];
  const refs=[];
  const tol2=opts.bgTol*opts.bgTol*3*1.44;
  for(const c of corners){
    if(c.a<20)continue;
    if(refs.some(r2=>(r2.r-c.r)**2+(r2.g-c.g)**2+(r2.b-c.b)**2<tol2/4))continue;
    refs.push(c)}
  if(!refs.length){undoStack.pop();uiQuick();toast('Corners pehle se transparent hain!');return}

      const dr=px[j]-rf.r,dg=px[j+1]-rf.g,db=px[j+2]-rf.b;
      if(dr*dr+dg*dg+db*db<=tol2){mask[i]=255;cnt++;break}}}
  if(!cnt){undoStack.pop();uiQuick();toast('Background detect nahi hua — Background Eraser (D) se click karke try karo','ok',3200);return}
  if(pixSel)for(let i=0;i<mask.length;i++)if(!pixSel.mask[i])mask[i]=0;

/* ---------- color trace (multi-color vector) ---------- */
function buildPalette(px,W,H,step,maxC){
  const counts=new Map();
  for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){
    const i=(y*W+x)*4;
    if(px[i+3]<128)continue;
    const key=((px[i]>>4)<<8)|((px[i+1]>>4)<<4)|(px[i+2]>>4);
    let e=counts.get(key);
    if(!e){e={n:0,r:0,g:0,b:0};counts.set(key,e)}
    e.n++;e.r+=px[i];e.g+=px[i+1];e.b+=px[i+2]}
  return[...counts.values()].sort((a,b)=>b.n-a.n).slice(0,maxC)
    .map(e=>({r:Math.round(e.r/e.n),g:Math.round(e.g/e.n),b:Math.round(e.b/e.n)}))}
function traceColor(L,o){
  bakeOffset(L);
  const step=Math.max(1,o.detail|0);
  const W=Math.floor(doc.w/step),H=Math.floor(doc.h/step);
  const src=L.canvas.getContext('2d').getImageData(0,0,doc.w,doc.h).data;
  const pal=buildPalette(src,doc.w,doc.h,step,clamp(o.colors|0,2,16));
  if(!pal.length){toast('Trace ke liye opaque pixels nahi mile','err');return}
  pal.sort((a,b)=>(b.r*.3+b.g*.6+b.b*.1)-(a.r*.3+a.g*.6+a.b*.1));
  const map=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=((y*step)*doc.w+x*step)*4;
    if(src[i+3]<128){map[y*W+x]=255;continue}
    let bi=0,bd=1e9;
    for(let p2=0;p2<pal.length;p2++){
      const dr=src[i]-pal[p2].r,dg=src[i+1]-pal[p2].g,db=src[i+2]-pal[p2].b;
      const d=dr*dr+dg*dg+db*db;
      if(d<bd){bd=d;bi=p2}}
    map[y*W+x]=bi}
  pushUndo();
  const V=ensureVectorLayer();
  const shapes=[];
  for(let pi=0;pi<pal.length;pi++){
    const mask=new Uint8Array(W*H);
    for(let i=0;i<map.length;i++)if(map[i]===pi)mask[i]=255;
    const loops=traceMaskLoops(mask,W,H);
    const subs=[];
    for(const loop of loops){
      const simp=rdp(loop,Math.max(0.4,o.simp/step));
      if(simp.length<3)continue;
      let area=0;
      for(let i=0;i<simp.length;i++){const q=simp[(i+1)%simp.length];area+=simp[i].x*q.y-q.x*simp[i].y}
      area=Math.abs(area)/2;
      if(area*step*step<(o.minArea||0))continue;
      let nodes;
      if(o.smooth)nodes=catmullNodes(simp,true)||simp.map(p2=>({p:{x:p2.x*step,y:p2.y*step},in:null,out:null}));
      else nodes=simp.map(p2=>({p:{x:p2.x*step,y:p2.y*step},in:null,out:null}));
      subs.push({nodes,closed:true})}
    if(!subs.length)continue;
    shapes.push({id:uid(),type:'path',subpaths:subs,evenodd:true,
      fill:{type:'solid',color:rgbToHex(pal[pi].r,pal[pi].g,pal[pi].b)},stroke:null,t:null,_dirty:true})}
  if(!shapes.length){undoStack.pop();uiQuick();toast('Trace me kuch nahi mila — Colors/Detail adjust karo','err');return}
  for(const s of shapes)V.shapes.push(s);
  selShapes=[];
  docDirty=true;needRender=true;uiProps();uiLayersRefresh();
  const nP=shapes.reduce((a,s)=>a+s.subpaths.length,0);
  toast('Color trace: '+shapes.length+' colors → '+nP+' vector shapes (Node tool A se edit karo)','ok',3600)}

/* ---------- rotate canvas 90° ---------- */
function rotateDoc(cw){
  commitFloat();
  pushUndo();
  const W=doc.w,H=doc.h;
  const T=cw?[0,1,-1,0,H,0]:[0,-1,1,0,0,W];
  for(const L of allLayersFlat()){
    if(L.type==='raster'){
      const tmp=mkCanvas(W,H);
      tmp.getContext('2d').drawImage(L.canvas,L.offset.x,L.offset.y);
      const c=mkCanvas(H,W);
      const g=c.getContext('2d');
      g.translate(cw?H:0,cw?0:W);
      g.rotate(cw?Math.PI/2:-Math.PI/2);
      g.drawImage(tmp,0,0);
      L.canvas=c;L.offset={x:0,y:0};layerVerBump(L)}
    else if(L.type==='vector'){
      for(const s of L.shapes){s.t=M.mul(T,s.t||M.id());s._dirty=true}}}
  doc.w=H;doc.h=W;
  comp=mkCanvas(doc.w,doc.h);
  doc.guides=(doc.guides||[]).map(g=>cw
    ?(g.axis==='h'?{axis:'v',pos:H-g.pos}:{axis:'h',pos:g.pos})
    :(g.axis==='h'?{axis:'v',pos:g.pos}:{axis:'h',pos:W-g.pos}));
  clearSel();clearPixSel();resetAnim();
  docDirty=true;fitView();needRender=true;uiLayersRefresh();
  toast('Canvas '+(cw?'90° CW':'90° CCW')+' rotated','ok')}

/* ---------- Curves (master RGB curve, draggable) ---------- */
function lutFromPoints(pts){
  pts=pts.slice().sort((a,b)=>a[0]-b[0]);
  const lut=new Uint8Array(256);
  for(let i=0;i<256;i++){
    if(i<=pts[0][0]){lut[i]=clamp(pts[0][1],0,255);continue}
    if(i>=pts[pts.length-1][0]){lut[i]=clamp(pts[pts.length-1][1],0,255);continue}
    for(let k=1;k<pts.length;k++){
      if(i<=pts[k][0]){
        const t=(i-pts[k-1][0])/((pts[k][0]-pts[k-1][0])||1);
        lut[i]=clamp(Math.round(lerp(pts[k-1][1],pts[k][1],t)),0,255);break}}}
  return lut}
function applyCurveLUT(d,lut){
  for(let i=0;i<d.length;i+=4){
    d[i]=lut[d[i]];d[i+1]=lut[d[i+1]];d[i+2]=lut[d[i+2]]}}

        const[x,y]=pos(e);

        if(i>0&&i<pts.length-1){pts.splice(i,1);draw()}});

        pts.length=0;

        else if(c==='dark')pts.push([0,0],[128,95],[255,255]);
        else if(c==='contrast')pts.push([0,0],[90,55],[170,210],[255,255]);
        else if(c==='fade')pts.push([0,38],[255,225]);
        else pts.push([0,0],[255,255]);
        draw()}));
      draw()}})}

/* ---------- GIF export (GIF89a + LZW) ---------- */
function rgbSample(data,w,h,maxSamples){
  const out=[];const total=w*h;
  const step=Math.max(1,Math.floor(total/maxSamples));
  for(let i=0;i<total;i+=step){
    const j=i*4;
    if(data[j+3]<128)continue;
    out.push([data[j],data[j+1],data[j+2]])}
  return out}
function medianCut(samples,maxColors){
  if(!samples.length)return[[0,0,0]];
  let boxes=[samples];
  while(boxes.length<maxColors){
    let bi=-1,best=0;
    for(let i=0;i<boxes.length;i++){
      const bx=boxes[i];if(bx.length<2)continue;
      let mn=[255,255,255],mx=[0,0,0];
      for(const p of bx)for(let c=0;c<3;c++){if(p[c]<mn[c])mn[c]=p[c];if(p[c]>mx[c])mx[c]=p[c]}
      const score=((mx[0]-mn[0])+(mx[1]-mn[1])+(mx[2]-mn[2])+18)*bx.length;
      if(score>best){best=score;bi=i}}
    if(bi<0)break;
    const bx=boxes[bi];
    let mn=[255,255,255],mx=[0,0,0];
    for(const p of bx)for(let c=0;c<3;c++){if(p[c]<mn[c])mn[c]=p[c];if(p[c]>mx[c])mx[c]=p[c]}
    let ch=0;for(let c=1;c<3;c++)if(mx[c]-mn[c]>mx[ch]-mn[ch])ch=c;
    bx.sort((a,b)=>a[ch]-b[ch]);
    const mid=bx.length>>1;
    boxes.splice(bi,1,bx.slice(0,mid),bx.slice(mid))}
  return boxes.map(bx=>{
    let r=0,g=0,b=0;for(const p of bx){r+=p[0];g+=p[1];b+=p[2]}
    const n=bx.length||1;
    return[Math.round(r/n),Math.round(g/n),Math.round(b/n)]})}
function lzwEncode(indices,minCode){
  const clear=1<<minCode,eoi=clear+1;
  let size=minCode+1,next=eoi+1;
  const dict=new Map();
  const bytes=[];let acc=0,bits=0;
  const put=c=>{acc|=c<<bits;bits+=size;
    while(bits>=8){bytes.push(acc&255);acc>>>=8;bits-=8}};
  put(clear);
  let prev=indices[0];
  for(let i=1;i<indices.length;i++){
    const c=indices[i],key=(prev<<8)|c;
    const v=dict.get(key);
    if(v!==undefined)prev=v;
    else{
      put(prev);
      if(next===4096){put(clear);dict.clear();next=eoi+1;size=minCode+1}
      else{
        if(next>=(1<<size)&&size<12)size++;
        dict.set(key,next);next++}
      prev=c}}
  put(prev);put(eoi);
  if(bits>0)bytes.push(acc&255);
  return bytes}
function gifEncode(frames,delayMs,loop){
  const W=frames[0].w,H=frames[0].h;
  const samples=[];
  for(const f of frames)samples.push(...rgbSample(f.data,f.w,f.h,20000));
  const pal=medianCut(samples,255);
  while(pal.length<256)pal.push([0,0,0]);
  const cache=new Map();
  const nearIdx=(r,g,b)=>{
    const key=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
    let v=cache.get(key);
    if(v!==undefined)return v;
    let bi=1,bd=1e9;
    for(let i=1;i<256;i++){
      const p=pal[i],dr=r-p[0],dg=g-p[1],db=b-p[2],d=dr*dr+dg*dg+db*db;
      if(d<bd){bd=d;bi=i}}
    cache.set(key,bi);return bi};
  const out=[];
  const push=(...bs)=>{for(const b of bs)out.push(b&255)};
  const str=s=>{for(let i=0;i<s.length;i++)out.push(s.charCodeAt(i))};
  str('GIF89a');
  push(W&255,W>>8,H&255,H>>8,0xF7,0,0);
  for(const c of pal)push(c[0],c[1],c[2]);
  push(0x21,0xFF,0x0B);str('NETSCAPE2.0');push(3,1,loop&255,(loop>>8)&255,0);
  const delay=Math.max(2,Math.round(delayMs/10));
  for(const f of frames){
    push(0x21,0xF9,4,0x05,delay&255,(delay>>8)&255,0,0);
    push(0x2C,0,0,0,0,W&255,W>>8,H&255,H>>8,0);
    const idx=new Uint8Array(f.w*f.h);
    for(let i=0;i<idx.length;i++){
      const j=i*4;
      idx[i]=f.data[j+3]<128?0:nearIdx(f.data[j],f.data[j+1],f.data[j+2])}
    const lzw=lzwEncode(idx,8);
    push(8);
    for(let i=0;i<lzw.length;i+=255){
      const chunk=lzw.slice(i,Math.min(i+255,lzw.length));
      push(chunk.length);
      for(const b of chunk)push(b)}
    push(0)}
  push(0x3B);
  return Uint8Array.from(out)}

/* ---------- PSD layers EXPORT ---------- */
const PSD_BLEND_OUT={'source-over':'norm','multiply':'mul ','screen':'scrn','overlay':'over','darken':'dark','lighten':'lite',
  'difference':'diff','exclusion':'excl','hue':'hue ','saturation':'sat ','color':'colr','luminosity':'lum ',
  'hard-light':'hLit','soft-light':'sLit','color-dodge':'norm','color-burn':'norm'};
function buildPSD(layerDefs,composite,W,H){
  const out=[];const push=(...bs)=>{for(const b of bs)out.push(b&255)};
  const str=s=>{for(let i=0;i<s.length;i++)out.push(s.charCodeAt(i))};
  const u16=v=>{push((v>>8)&255,v&255)};
  const u32=v=>{push((v>>>24)&255,(v>>16)&255,(v>>8)&255,v&255)};
  str('8BPS');u16(1);push(0,0,0,0,0,0);
  u16(3);u32(H);u32(W);u16(8);u16(3);
  u32(0);u32(0);
  // ---- layer & mask ----
  const lm=[];
  const lmPush=(...bs)=>{for(const b of bs)lm.push(b&255)};
  const lmStr=s=>{for(let i=0;i<s.length;i++)lmPush(s.charCodeAt(i))};
  const lm16=v=>{lmPush((v>>8)&255,v&255)};
  const lm32=v=>{lmPush((v>>>24)&255,(v>>16)&255,(v>>8)&255,v&255)};
  lm16(layerDefs.length);
  const channelDataChunks=[];
  for(const L of layerDefs){
    const w=L.w,h=L.h;
    lm32(L.top);lm32(L.left);lm32(L.top+h);lm32(L.left+w);
    lm16(4);
    const chIds=[0,1,2,-1];
    const chans={R:L.R,G:L.G,B:L.B,A:L.A};
    for(const id of chIds){
      lm16(id<0?65535:id);
      lm32(2+w*h)}
    lmStr('8BIM');lmStr(PSD_BLEND_OUT[L.blend]||'norm');
    lmPush(L.opacity,0,L.hidden?2:0,0);
    const name=(L.name||'Layer').slice(0,26);
    const nameLen=1+name.length;
    const pad=(4-nameLen%4)%4;
    lm32(4+4+nameLen+pad+ (0)+(0)+0); // mask(4:0) + ranges(4:0) + name
    lm32(0);lm32(0);
    lmPush(name.length);lmStr(name);
    for(let k=0;k<pad;k++)lmPush(0);
    // channel data assembled after records
    const chunk=[];
    const cp=(...bs)=>{for(const b of bs)chunk.push(b&255)};
    cp(0,0);for(let i=0;i<w*h;i++)chunk.push(chans.R[i]&255);
    cp(0,0);for(let i=0;i<w*h;i++)chunk.push(chans.G[i]&255);
    cp(0,0);for(let i=0;i<w*h;i++)chunk.push(chans.B[i]&255);
    cp(0,0);for(let i=0;i<w*h;i++)chunk.push(chans.A[i]&255);
    channelDataChunks.push(chunk)}
  let chanTotal=0;
  for(const ch of channelDataChunks)chanTotal+=ch.length;
  const liLen=lm.length+chanTotal;
  const lmLen=4+liLen+4;
  u32(lmLen);
  u32(liLen);
  for(const b of lm)push(b);
  for(const ch of channelDataChunks)for(const b of ch)push(b);
  u32(0);
  // ---- composite ----
  push(0,0);
  const n=W*H;
  for(let i=0;i<n;i++)push(composite.R?composite.R[i]:0);
  for(let i=0;i<n;i++)push(composite.G?composite.G[i]:0);
  for(let i=0;i<n;i++)push(composite.B?composite.B[i]:0);
  return Uint8Array.from(out)}
function exportPSDFile(){
  commitFloat();
  const leaves=allLayersFlat().filter(l=>l.type!=='group'&&l.type!=='vector');
  const vectors=allLayersFlat().filter(l=>l.type==='vector'&&l.visible);
  if(!leaves.length&&!vectors.length){toast('Export ke liye layer chahiye');return}
  toast('PSD (layers) export ho raha hai…');
  setTimeout(()=>{
    try{
      renderComposite();
      const defs=[];
      let lastBaseCv=null;
      for(const L of leaves){
        bakeOffset(L);
        let srcCv=L.canvas;
        if(L.mask&&L.mask.enabled){srcCv=mkCanvas(doc.w,doc.h);const sg=srcCv.getContext('2d');
          sg.drawImage(L.canvas,0,0);sg.globalCompositeOperation='destination-in';
          sg.drawImage(L.mask.canvas,0,0)}

          t2g.drawImage(srcCv,0,0);t2g.globalCompositeOperation='destination-in';
          t2g.drawImage(lastBaseCv,0,0);srcCv=t2}
        lastBaseCv=srcCv;
        const img=srcCv.getContext('2d').getImageData(0,0,doc.w,doc.h).data;
        const n=doc.w*doc.h;
        const R=new Uint8Array(n),G=new Uint8Array(n),B=new Uint8Array(n),A=new Uint8Array(n);
        for(let i=0;i<n;i++){R[i]=img[i*4];G[i]=img[i*4+1];B[i]=img[i*4+2];A[i]=img[i*4+3]}
        defs.push({name:L.name,top:0,left:0,w:doc.w,h:doc.h,R,G,B,A,
          opacity:Math.round(clamp(L.opacity,0,1)*255),hidden:L.visible===false,blend:L.blend})}
      for(const V of vectors){
        const c=mkCanvas(doc.w,doc.h);const g=c.getContext('2d');
        for(const s of V.shapes)drawShape(g,s);

        const n=doc.w*doc.h;
        const R=new Uint8Array(n),G=new Uint8Array(n),B=new Uint8Array(n),A=new Uint8Array(n);
        for(let i=0;i<n;i++){R[i]=img[i*4];G[i]=img[i*4+1];B[i]=img[i*4+2];A[i]=img[i*4+3]}
        defs.push({name:V.name+' (vector)',top:0,left:0,w:doc.w,h:doc.h,R,G,B,A,
          opacity:Math.round(clamp(V.opacity,0,1)*255),hidden:false,blend:V.blend})}
      const ci=comp.getContext('2d').getImageData(0,0,doc.w,doc.h).data;
      const n=doc.w*doc.h;
      const CR=new Uint8Array(n),CG=new Uint8Array(n),CB=new Uint8Array(n);
      for(let i=0;i<n;i++){CR[i]=ci[i*4];CG[i]=ci[i*4+1];CB[i]=ci[i*4+2]}
      const bytes=buildPSD(defs,{R:CR,G:CG,B:CB},doc.w,doc.h);
      download(safeName(doc.name)+'.psd',new Blob([bytes],{type:'image/vnd.adobe.photoshop'}));
      toast('PSD exported: '+defs.length+' layers — Photoshop/Krita/GIMP me kholo','ok',4200)}
    catch(e){toast('PSD export fail: '+e.message,'err',4200)}},30)}

function kPosterize(d,lev){const n=Math.max(2,lev|0),st=255/(n-1);
  for(let i=0;i<d.length;i+=4){if(d[i+3]<8)continue;
    d[i]=Math.round(Math.round(d[i]/st)*st);d[i+1]=Math.round(Math.round(d[i+1]/st)*st);d[i+2]=Math.round(Math.round(d[i+2]/st)*st)}}
function kWarm(d){for(let i=0;i<d.length;i+=4){if(d[i+3]<8)continue;
  d[i]=Math.min(255,d[i]*1.10+6);d[i+1]=Math.min(255,d[i+1]*1.02+2);d[i+2]=d[i+2]*0.92}}
function kCool(d){for(let i=0;i<d.length;i+=4){if(d[i+3]<8)continue;
  d[i]=d[i]*0.92;d[i+1]=Math.min(255,d[i+1]*1.02);d[i+2]=Math.min(255,d[i+2]*1.10+6)}}
function kDuotone(d,dr,dg,db,lr,lg,lb){for(let i=0;i<d.length;i+=4){if(d[i+3]<8)continue;
  const l=(d[i]*.299+d[i+1]*.587+d[i+2]*.114)/255;
  d[i]=dr+(lr-dr)*l;d[i+1]=dg+(lg-dg)*l;d[i+2]=db+(lb-db)*l}}

async function importVideoFramesFile(file,vopts){
  vopts=vopts||{};

  const v=document.createElement('video');
  v.muted=true;v.playsInline=true;v.preload='auto';
  v.src=url;
  try{await new Promise((res,rej)=>{v.onloadedmetadata=()=>res();v.onerror=()=>rej(new Error('Video load fail — ye format browser support nahi karta'))});
    if(!v.videoWidth)throw new Error('Video decode fail')}
  catch(err){toast(err.message,'err');return}
  const dur=Math.max(0.1,v.duration||1);
  modal({title:'Import Video Frames 🎬',
    body:'<div class="pnote">'+v.videoWidth+'×'+v.videoHeight+' · '+dur.toFixed(1)+'s — frames Animation Timeline me jayenge</div>'
    +'<div class="mrow"><label>FPS sample</label><input type="range" id="vfFps" min="2" max="24" value="8"><span class="rv" id="vfFpsV">8</span></div>'
    +'<div class="mrow"><label>Max frames</label><input type="range" id="vfMax" min="2" max="40" value="16"><span class="rv" id="vfMaxV">16</span></div>'
    +'<div class="pnote">Tip: bade video me frames kam rakho — memory bachegi</div>',
    buttons:[{l:'Cancel'},{l:'Import',cls:'acc',fnClose:true,fn:()=>{
      const f1=document.getElementById('vfFps'),f2=document.getElementById('vfMax');
      sampleVideoFrames(v,dur,fps2=>0,+((f1&&f1.value)||8),+((f2&&f2.value)||16))}}]});
  const r1=document.getElementById('vfFps');if(r1)r1.addEventListener('input',()=>{const s=document.getElementById('vfFpsV');if(s)s.textContent=r1.value});
  const r2=document.getElementById('vfMax');if(r2)r2.addEventListener('input',()=>{const s=document.getElementById('vfMaxV');if(s)s.textContent=r2.value})}
async function sampleVideoFrames(v,dur,fps,max){
  try{
    if(!doc)makeDoc(1280,720,'#ffffff');
    commitFloat&&commitFloat();
    pushUndo(null,'Video Frames');
    animEnsure();animStop();
    const vl=newRasterLayer('Video');
    doc.layers.push(vl);doc.activeId=vl.id;uiLayers();
    const n=Math.max(1,Math.min(max,Math.floor(dur*fps)||1));
    const step=dur/n;
    anim.frames=[];
    for(let i=0;i<n;i++){
      const t=Math.min(Math.max(0,dur-0.03),i*step);
      await new Promise(res=>{const h=()=>{v.removeEventListener('seeked',h);res()};v.addEventListener('seeked',h);v.currentTime=t});
      const c=mkCanvas(doc.w,doc.h);const g=c.getContext('2d');
      const s=Math.min(doc.w/v.videoWidth,doc.h/v.videoHeight);
      const w=v.videoWidth*s,h2=v.videoHeight*s;
      g.drawImage(v,(doc.w-w)/2,(doc.h-h2)/2,w,h2);
      const f=blankFrame();
      const cell=f.cells.find(x=>x.id===vl.id&&x.kind==='r');
      if(cell)cell.canvas=c;
      anim.frames.push(f);
      if(i%4===0)toast('Frames: '+Math.round(i/n*100)+'%…',null,900);
      await new Promise(r3=>setTimeout(r3,0))}
    anim.cur=0;applyFrame(anim.frames[0]);
    if(typeof tlEl==='undefined'||!tlEl)buildTimeline();
    if(tlEl&&tlEl.style.display==='none')toggleTimeline();
    needRender=true;docDirty=true;
    toast(n+' frames import ho gaye 🎬 — Animation timeline me dekho','ok',3600)}
  catch(err){toast('Video import: '+err.message,'err')}}

function libSave(){try{return lsSet('artvision_lib',JSON.stringify(libAssets))}catch(e){return false}}
function libFolders(){const s=new Set(['General']);libAssets.forEach(a=>s.add(a.f||'General'));return Array.from(s)}
function libSaveSelection(name,folder){
  libLoad();
  commitFloat();
  let a=null;const nm=name||('Asset '+(libAssets.length+1));const fo=folder||'General';
  if(typeof selShapes!=='undefined'&&selShapes.length){
    a={kind:'v',data:JSON.stringify(selShapes,(k,v)=>k[0]==='_'?undefined:v)}}
  else{
    const L=activeLayer();
    if(!L){toast('Kuch select karo ya layer chuno','err');return false}
    bakeOffset(L);
    const c=mkCanvas(doc.w,doc.h);c.getContext('2d').drawImage(L.canvas,0,0);
    const g=c.getContext('2d');const im=g.getImageData(0,0,doc.w,doc.h).data;
    let x0=doc.w,y0=doc.h,x2=0,y2=0;
    for(let y=0;y<doc.h;y+=2)for(let x=0;x<doc.w;x+=2){
      if(im[(y*doc.w+x)*4+3]>8){if(x<x0)x0=x;if(x>x2)x2=x;if(y<y0)y0=y;if(y>y2)y2=y}}
    if(x2<=x0){toast('Layer khaali hai','err');return false}
    x0=Math.max(0,x0-2);y0=Math.max(0,y0-2);x2=Math.min(doc.w-1,x2+2);y2=Math.min(doc.h-1,y2+2);
    const c2=mkCanvas(x2-x0+1,y2-y0+1);
    c2.getContext('2d').drawImage(c,x0,y0,x2-x0+1,y2-y0+1,0,0,x2-x0+1,y2-y0+1);
    let data;
    try{data=c2.toDataURL('image/png')}catch(e){toast('Export fail','err');return false}
    a={kind:'r',data,w:c2.width,h:c2.height}}
  a={id:'la'+Date.now()+Math.floor(Math.random()*99),name:nm,f:fo,...a};
  libAssets.unshift(a);
  if(!libSave()){libAssets.shift();toast('Library full hai — purane hatao','err');return false}
  toast('Library me save: '+nm+' 🗂','ok');return true}
function libPlace(a){
  commitFloat();
  if(a.kind==='v'){
    let shapes;try{shapes=JSON.parse(a.data)}catch(e){return}
    const L=(activeLayer()&&activeLayer().type==='vector')?activeLayer():ensureVectorLayer();
    pushUndo(null,'Library place');
    let bx=1e9,by=1e9,bx2=-1e9,by2=-1e9;
    shapes.forEach(s=>{const b=shapeLocalBBox(s);const t=s.t||M.id();
      const ps=[M.apply(t,{x:b.x,y:b.y}),M.apply(t,{x:b.x2,y:b.y}),M.apply(t,{x:b.x2,y:b.y2}),M.apply(t,{x:b.x,y:b.y2})];
      ps.forEach(p=>{bx=Math.min(bx,p.x);by=Math.min(by,p.y);bx2=Math.max(bx2,p.x);by2=Math.max(by2,p.y)})});
    const dx=doc.w/2-(bx+bx2)/2,dy=doc.h/2-(by+by2)/2;
    shapes.forEach(s=>{const ns=JSON.parse(JSON.stringify(s));
      if(ns.t){ns.t=[ns.t[0],ns.t[1],ns.t[2],ns.t[3],ns.t[4]+dx,ns.t[5]+dy]}
      else{ns.t=[1,0,0,1,dx,dy]}
      ns.id=uid();ns._dirty=true;L.shapes.push(ns)});
    selShapes=shapes.length?[L.shapes[L.shapes.length-1]]:[];
    if(shapes.length>1){selShapes=L.shapes.slice(-shapes.length)}
    docDirty=true;needRender=true;uiLayers();uiProps();
    toast('Placed: '+a.name,'ok',1400)}
  else{
    const im=new Image();
    im.onload=()=>{
      pushUndo(null,'Library place');
      const L=newRasterLayer(a.name);
      doc.layers.push(L);doc.activeId=L.id;
      const s=Math.min(1,Math.min(doc.w/a.w,doc.h/a.h));
      const w=a.w*s,h=a.h*s;
      L.canvas.getContext('2d').drawImage(im,(doc.w-w)/2,(doc.h-h)/2,w,h);
      layerVerBump(L);docDirty=true;needRender=true;uiLayers();
      toast('Placed: '+a.name,'ok',1400)};
    im.src=a.data}}

                     libLoad();libAssets.unshift({id:'la'+Date.now(),name:f.name.replace(/\.[^.]+$/,''),f:'General',kind:'r',data:String(rd.result),w:im2.width,h:im2.height});
                     libSave();setTimeout(()=>{libDialogRefresh(cur)},50)};im2.src=String(rd.result)};

function libDialogRefresh(cur){
  document.querySelectorAll('.modal-ov').forEach(o=>o.remove());libDialog(cur)}
function libDialogBind(cur){
  document.querySelectorAll('.tchip[data-lf]').forEach(c=>c.addEventListener('click',()=>libDialog(c.dataset.lf)));
  document.querySelectorAll('.libcell').forEach(cell=>{
    cell.querySelector('.mx').addEventListener('click',ev=>{ev.stopPropagation();
      libLoad();libAssets=libAssets.filter(x=>x.id!==cell.dataset.li);libSave();libDialogRefresh(cur)});
    cell.addEventListener('click',()=>{libLoad();const a=libAssets.find(x=>x.id===cell.dataset.li);if(a)libPlace(a)})});
  document.querySelectorAll('canvas[data-lv]').forEach(cnv=>{
    const a=libAssets.find(x=>x.id===cnv.dataset.lv);if(!a)return;
    let shapes;try{shapes=JSON.parse(a.data)}catch(e){return}
    const g=cnv.getContext('2d');
    let bx=1e9,by=1e9,bx2=-1e9,by2=-1e9;
    shapes.forEach(s=>{const b=shapeLocalBBox(s);const t=s.t||M.id();
      const ps=[M.apply(t,{x:b.x,y:b.y}),M.apply(t,{x:b.x2,y:b.y}),M.apply(t,{x:b.x2,y:b.y2}),M.apply(t,{x:b.x,y:b.y2})];
      ps.forEach(p=>{bx=Math.min(bx,p.x);by=Math.min(by,p.y);bx2=Math.max(bx2,p.x);by2=Math.max(by2,p.y)})});
    const w=Math.max(1,bx2-bx),hh=Math.max(1,by2-by);
    const sc=Math.min(84/w,84/hh)*.9;
    g.save();g.translate(42-(bx+bx2)/2*sc,42-(by+by2)/2*sc);g.scale(sc,sc);
    shapes.forEach(s=>{try{drawShape(g,s)}catch(e){}});g.restore()})}

let maskEditId=null;
function maskAdd(reveal){
  const L=activeLayer();
  if(!L||L.type!=='raster'){toast('Mask sirf bitmap layer par — raster layer chuno');return}
  pushUndo(null,'Mask add');
  const c=mkCanvas(doc.w,doc.h);
  if(reveal){const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,doc.w,doc.h)}
  L.mask={canvas:c,enabled:true};
  maskEditId=L.id;
  layerVerBump(L);docDirty=true;needRender=true;uiLayers();
  toast(reveal?'Mask added (Reveal All) — ◐ mode: brush=reveal, eraser=hide':'Mask added (Hide All) — brush se reveal karo','ok',2600)}
function maskInvert(){
  const L=activeLayer();if(!L||!L.mask){toast('Is layer par mask nahi hai');return}
  pushUndo(null,'Mask invert');
  const tmp=cloneCanvas(L.mask.canvas);const g=L.mask.canvas.getContext('2d');
  g.save();g.globalCompositeOperation='source-over';g.fillStyle='#ffffff';g.fillRect(0,0,doc.w,doc.h);
  g.globalCompositeOperation='destination-out';g.drawImage(tmp,0,0);g.restore();
  layerVerBump(L);docDirty=true;needRender=true;uiLayersRefresh();
  toast('Mask inverted','ok')}
function maskApplyBake(){
  const L=activeLayer();if(!L||!L.mask){toast('Is layer par mask nahi hai');return}
  pushUndo(null,'Mask apply');
  const g=L.canvas.getContext('2d');
  g.save();g.globalCompositeOperation='destination-in';g.drawImage(L.mask.canvas,0,0);g.restore();
  L.mask=null;if(maskEditId===L.id)maskEditId=null;
  layerVerBump(L);docDirty=true;needRender=true;uiLayers();
  toast('Mask layer me bake ho gaya','ok')}
function maskDelete(){
  const L=activeLayer();if(!L||!L.mask){toast('Is layer par mask nahi hai');return}
  pushUndo(null,'Mask delete');
  L.mask=null;if(maskEditId===L.id)maskEditId=null;
  docDirty=true;needRender=true;uiLayers();
  toast('Mask delete (discard)','ok')}
function maskToggleEnable(){
  const L=activeLayer();if(!L||!L.mask){toast('Is layer par mask nahi hai');return}
  pushUndo(null,'Mask '+(L.mask.enabled?'off':'on'));
  L.mask.enabled=!L.mask.enabled;
  docDirty=true;needRender=true;uiLayersRefresh();
  toast('Mask '+(L.mask.enabled?'ON':'OFF'),null,1400)}
function maskEditToggle(){
  const L=activeLayer();
  if(!L||L.type!=='raster'){toast('Mask paint sirf bitmap layer par');return}
  if(!L.mask){maskAdd(true);return}
  maskEditId=(maskEditId===L.id)?null:L.id;
  uiLayers();
  toast(maskEditId?'🎭 Mask paint ON — brush=reveal · eraser=hide (○ chip dekho)':'Mask paint OFF',null,2200)}
function maskFromSel(){

let boards=null,boardCur=0;
function freshAnim(){return{frames:[],cur:0,fps:12,playing:false,onion:true,onionN:1,onionOp:.28,timer:null,onionCanvas:null}}
function boardEnsure(){
  if(boards)return;
  if(!doc){boards=[];return}
  boards=[{name:doc.name,doc,comp,undo:undoStack,redo:redoStack,hist:histNames,redoN:redoNames,anim}];
  boardCur=0}
function boardCapture(){
  boardEnsure();
  if(!doc)return;
  if(!boards[boardCur])boards[boardCur]={name:doc.name,doc,comp,undo:[],redo:[],hist:[],redoN:[],anim};
  const b=boards[boardCur];
  b.name=doc.name;b.doc=doc;b.comp=comp;b.undo=undoStack;b.redo=redoStack;b.hist=histNames;b.redoN=redoNames;b.anim=anim}
function boardApply(i){
  boardCapture();
  boardCur=clamp(i,0,boards.length-1);
  const b=boards[boardCur];
  if(textEdit)commitTextEdit();
  if(RT)cancelRT(true);
  if(pen&&pen.nodes&&pen.nodes.length)commitPen(false);
  pen=null;
  doc=b.doc;
  comp=b.comp||mkCanvas(doc.w,doc.h);b.comp=comp;
  undoStack=b.undo||[];b.undo=undoStack;
  redoStack=b.redo||[];b.redo=redoStack;
  histNames=b.hist||[];b.hist=histNames;
  redoNames=b.redoN||[];b.redoN=redoNames;
  anim=b.anim||freshAnim();b.anim=anim;anim.playing=false;
  snapCache={};clearSel();pixSel=null;cancelRT(true);maskEditId=null;G={};
  renderComposite();
  if(anim.frames.length)applyFrame(anim.frames[anim.cur]);
  buildOnion();
  if(typeof uiFrames==='function'&&typeof framesEl!=='undefined'&&framesEl)uiFrames();
  uiLayers();uiProps();uiQuick();buildBoardTabs();fitView();
  docDirty=true;needRender=true;
  toast('Artboard: '+(doc.name||'untitled'),null,1100)}
function boardCreate(name,w,h,bg){
  if(textEdit)commitTextEdit();
  if(RT)cancelRT(true);
  boardCapture();
  makeDoc(w,h,bg||'#ffffff');
  doc.name=name||('Artboard '+(boards.length+1));
  undoStack=[];redoStack=[];histNames=[];redoNames=[];snapCache={};
  anim=freshAnim();resetAnim();
  clearSel();pixSel=null;maskEditId=null;G={};
  boards.push({name:doc.name,doc,comp,undo:undoStack,redo:redoStack,hist:histNames,redoN:redoNames,anim});
  boardCur=boards.length-1;
  uiLayers();uiProps();uiQuick();fitView();docDirty=true;needRender=true;buildBoardTabs();
  toast('Naya artboard: '+doc.name,'ok')}
function boardDup(){
  if(!doc)return;
  if(textEdit)commitTextEdit();
  commitFloat();
  boardCapture();
  const layers=doc.layers.map(serializeLayer).map(deserializeLayer);
  const nd={name:(doc.name||'untitled')+' copy',w:doc.w,h:doc.h,
    guides:JSON.parse(JSON.stringify(doc.guides||[])),layers,
    activeId:(layers[layers.length-1]||{}).id};
  const keep={undo:undoStack,redo:redoStack,hist:histNames,redoN:redoNames,anim};
  const na=freshAnim();na.fps=keep.anim.fps;na.cur=keep.anim.cur;
  na.frames=(keep.anim.frames||[]).map(f=>deepFrame(f));
  doc=nd;comp=mkCanvas(nd.w,nd.h);
  undoStack=[];redoStack=[];histNames=[];redoNames=[];snapCache={};
  anim=na;resetAnim();anim=na;
  renderComposite();
  boards.push({name:nd.name,doc:nd,comp,undo:[],redo:[],hist:[],redoN:[],anim:na});
  boardCur=boards.length-1;
  uiLayers();uiProps();uiQuick();fitView();docDirty=true;needRender=true;buildBoardTabs();
  toast('Artboard duplicate: '+nd.name,'ok')}
function boardClose(i){
  boardEnsure();
  if(!boards.length){toast('Pehle document kholo');return}
  if(boards.length<=1){toast('Aakhri artboard close nahi ho sakta');return}
  i=(i==null)?boardCur:clamp(i,0,boards.length-1);
  if(textEdit)commitTextEdit();
  if(RT)cancelRT(true);
  boards.splice(i,1);
  if(boardCur>=i)boardCur=Math.max(0,boardCur-1);
  boardApply(boardCur);
  toast('Artboard closed','ok')}
function boardRename(i){

function clipToggle(){
  if(!doc){toast('Pehle document kholo');return}
  const L=activeLayer();
  if(!L||L.type==='group'){toast('Group clip nahi ho sakta — raster/vector layer chuno');return}
  // base check: neeche koi visible non-clip layer honi chahiye
  const fl=allLayersFlat();
  const idx=fl.findIndex(x=>x.id===L.id);
  const hasBase=fl.slice(0,idx).some(x=>x.visible&&!x.clip);
  if(!hasBase&&!L.clip){toast('Neeche koi base layer nahi — pehle layer banao');return}
  pushUndo(null,L.clip?'Clip release':'Clip create');
  L.clip=!L.clip;
  docDirty=true;needRender=true;uiLayers();
  toast(L.clip?'↳ Clipped to layer below (sirf base ke pixels par dikhega)':'Clip released','ok',1800)}
function exportAllBoards(){
  boardCapture();
  if(!boards||boards.length<2){toast('Sirf 1 artboard hai — Quick Export PNG (Ctrl+Shift+E) use karo');return}
  const names=boards.map((b,i)=>safeName(b.name||('artboard'+(i+1))));
  toast(boards.length+' artboards PNG me export ho rahe… 🗂');
  let i=0;
  const step=()=>{
    if(i>=boards.length){toast('Sab boards export ho gaye ✅','ok',2600);return}
    boardApply(i);
    renderComposite();
    try{
      const a=document.createElement('a');
      a.href=comp.toDataURL('image/png');
      a.download=names[i]+'.png';
      document.body.appendChild(a);a.click();a.remove();
      toast((i+1)+'/'+boards.length+' — '+names[i],null,900)}
    catch(err){toast('Export fail: '+err.message,'err')}
    i++;setTimeout(step,420)};
  setTimeout(step,60)}
function maskFeather(){
  const L=activeLayer();
  if(!L||!L.mask){toast('Is layer par mask nahi hai — pehle Layer > Add Layer Mask');return}
  modal({title:'Mask Feather — soft edge',
    body:'<div class="mrow"><label>Radius</label><input type="range" id="mfR" min="2" max="120" value="24"><span class="rv" id="mfRV">24px</span></div>'
      +'<div class="pnote">Mask ke edges blur honge — photo blend / soft vignette ke liye. Undo (Ctrl+Z) available.</div>',
    buttons:[{l:'Cancel'},{l:'Feather',cls:'acc',fnClose:true,fn:()=>{
      const r=Math.max(2,Math.min(120,+((document.getElementById('mfR')||{}).value||24)));
      pushUndo(null,'Mask feather');
      const src=cloneCanvas(L.mask.canvas);
      const g=L.mask.canvas.getContext('2d');
      g.save();g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';
      g.clearRect(0,0,doc.w,doc.h);
      let done=false;

async function importSmartFile(f){

      'Vector formats vector hi rehte hain (zoom karne par pixel nahi bante).</p>' +
      '<div style="overflow:auto;border:1px solid rgba(255,255,255,.12);border-radius:10px">' +
      '<table style="border-collapse:collapse;width:100%;min-width:520px">' +
      '<thead><tr style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.65;text-align:left">' +
      '<th style="padding:7px 8px"> </th><th style="padding:7px 8px">App</th><th style="padding:7px 8px">Version</th><th style="padding:7px 8px">Import</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' +
      '<p style="margin:12px 0 0;font-size:11.5px;opacity:.72;line-height:1.55">' +
      '<b>Tip:</b> kisi bhi app se <b>File ▸ Export ▸ SVG</b> (ya PDF) karo — wo Studio me 100% editable nodes ban jata hai. ' +
      'Affinity/Canva SVG export hi best route hai.</p>';
    try { modal({ title: 'Supported apps & formats', body: body }); }
    catch (e) { try { toast('Formats: CDR · PSD/PSB · AI · SVG · PDF', 'ok', 5000); } catch (e2) {} }
  }

  function installMenuEntries() {
    try {
      if (typeof MENUS !== 'object' || !MENUS) return;
      var has = MENUS.Help.some(function (it) { return it && it.l === 'Supported apps & formats…'; });
      if (!has) {
        MENUS.Help.unshift({ l: 'Supported apps & formats… 🧩', a: formatDialog });
        MENUS.Help.unshift('-');
      }
      if (MENUS.File && !MENUS.File.some(function (it) { return it && it.l === 'Import Photoshop PSB…'; })) {
        var idx = 2;
        MENUS.File.splice(idx, 0, { l: 'Open / Import… (PSB · AI · Affinity · Canva export)', a: function () { $('#fileInput').click(); } });
      }
      // rebuild the menu bar so the new entries show up immediately
      if (typeof buildMenus === 'function') {
        var nav = document.getElementById('menus');
        if (nav) nav.innerHTML = '';
        buildMenus();
      }
    } catch (e) {}
  }

  /* ══════════════════ install ══════════════════ */
  function install() {
    if (window.__avVectorFix) return;
    window.__avVectorFix = true;
    installPointerGuards();
    installToastLimiter();
    installActivityTracking();
    installCrispRender();
    installPSD();
    installMenuEntries();
    try { window.avFormatDialog = formatDialog; } catch (e) {}
    try { if (typeof needRender !== 'undefined') needRender = true; } catch (e) {}
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(install, 0); });
  else setTimeout(install, 0);
})();

      r3 = coordOf(r, version);
      if (version < 900) { r2 = r3; r1 = r3; r0 = r3; }
      else { r2 = coordOf(r, version); r1 = coordOf(r, version); r0 = coordOf(r, version); }
    } else {
      const s1 = r.f64(); if (Math.abs(s1) > 1e-9) scaleX = s1;
      const s2 = r.f64(); if (Math.abs(s2) > 1e-9) scaleY = s2;
      const scaleWith = r.u8();
      r.skip(7);
      const w = Math.abs(x0 * scaleX / 2), h = Math.abs(y0 * scaleY / 2);
      const m = Math.min(w, h);
      if (scaleWith === 0) {
        r3 = r.f64(); cornerType = r.u8(); r.skip(15);
        r2 = r.f64(); r.skip(16);
        r1 = r.f64(); r.skip(16);
        r0 = r.f64();
        r3 *= m; r2 *= m; r1 *= m; r0 *= m;
      } else {
        r3 = coordOf(r, version); cornerType = r.u8(); r.skip(15);
        r2 = coordOf(r, version); r.skip(16);
        r1 = coordOf(r, version); r.skip(16);
        r0 = coordOf(r, version);
      }
    }
    const rounded = Math.abs(r0) > 1e-9 || Math.abs(r1) > 1e-9 || Math.abs(r2) > 1e-9 || Math.abs(r3) > 1e-9;
    if (!rounded) {
      return { paths: [{ rect: true, x0, y0 }] };
    }
    // Build a rounded rectangle outline
    const path = [];
    const push = (type, x, y, c1, c2) => path.push({ type, x, y, c1, c2 });
    // Q: control point in x/y, end point as a {x,y} in c1 (segsToRings contract)
    const pushQ = (cx, cy, ex, ey) => path.push({ type: 'Q', x: cx, y: cy, c1: { x: ex, y: ey } });
    const rx0 = r0 / scaleX, rx1 = r1 / scaleX, rx2 = r2 / scaleX, rx3 = r3 / scaleX;
    const ry0 = r0 / scaleY, ry1 = r1 / scaleY, ry2 = r2 / scaleY, ry3 = r3 / scaleY;
    push('M', 0, -ry0);
    if (r1 > 0) {
      push('L', 0, y0 + ry1);
      if (cornerType === 0) pushQ(0, y0, rx1, y0);
      else if (cornerType === 1) pushQ(rx1, y0 + ry1, rx1, y0);
      else push('L', rx1, y0);
    } else push('L', 0, y0);
    if (r2 > 0) {
      push('L', x0 - rx2, y0);
      if (cornerType === 0) pushQ(x0, y0, x0, y0 + ry2);
      else if (cornerType === 1) pushQ(x0 - rx2, y0 + ry2, x0, y0 + ry2);
      else push('L', x0, y0 + ry2);
    } else push('L', x0, y0);
    if (r3 > 0) {
      push('L', x0, -ry3);
      if (cornerType === 0) pushQ(x0, 0, x0 - rx3, 0);
      else if (cornerType === 1) pushQ(x0 - rx3, -ry3, x0 - rx3, 0);
      else push('L', x0 - rx3, 0);
    } else push('L', x0, 0);
    if (r0 > 0) {
      push('L', rx0, 0);
      if (cornerType === 0) pushQ(0, 0, 0, -ry0);
      else if (cornerType === 1) pushQ(rx0, -ry0, 0, -ry0);
      else push('L', 0, -ry0);
    } else push('L', 0, 0);
    return { paths: [{ segs: path, closed: true }], rounded: { r0, r1, r2, r3, cornerType } };
  }

  function readEllipseRange(r, version) {
    const w = coordOf(r, version);
    const h = coordOf(r, version);
    const a1 = r.s32() / 1000000;
    const a2 = r.s32() / 1000000;
    const pie = r.u32() !== 0;
    const cx = w / 2, cy = h / 2;
    const rx = Math.abs(cx), ry = Math.abs(cy);
    let start = a1 * 180 / Math.PI, end = a2 * 180 / Math.PI;
    if (Math.abs(a1 - a2) < 1e-7) {
      return { paths: [{ ellipse: true, cx, cy, rx, ry }] };
    }
    // Normalise: libcdr measures CCW from +X with Y up.
    const path = [];
    const push = (type, x, y, c1, c2) => path.push({ type, x, y, c1, c2 });
    // Q: control point in x/y, end point as a {x,y} in c1 (segsToRings contract)
    const pushQ = (cx, cy, ex, ey) => path.push({ type: 'Q', x: cx, y: cy, c1: { x: ex, y: ey } });
    let s = a1, e = a2;
    while (e < s) e += Math.PI * 2;
    // approximate arc with cubic segments (<=90° each)
    const n = Math.max(1, Math.ceil((e - s) / (Math.PI / 2)));
    const step = (e - s) / n;
    const ptAt = t => ({ x: cx + rx * Math.cos(t), y: cy + ry * Math.sin(t) });
    const p0 = ptAt(s);
    push('M', p0.x, p0.y);
    for (let i = 0; i < n; i++) {
      const t0 = s + step * i, t1 = t0 + step;
      const k = 4 / 3 * Math.tan(step / 4);
      const pA = ptAt(t0), pB = ptAt(t1);
      const c1 = { x: pA.x - k * rx * Math.sin(t0), y: pA.y + k * ry * Math.cos(t0) };
      const c2 = { x: pB.x + k * rx * Math.sin(t1), y: pB.y - k * ry * Math.cos(t1) };
      push('C', pB.x, pB.y, c1, c2);
    }
    if (pie) {
      push('L', cx, cy);
      push('L', p0.x, p0.y);
      path.closed = true;
    }
    return { paths: [{ segs: path, closed: !!pie }] };
  }

  function readPath(r, version) {
    // CDR path (chunkType 0x25): 4-byte skip, two summed u16 counts, 16-byte skip
    r.skip(4);
    let pointNum = r.u16() + r.u16();
    const ps = 2 * (version >= 600 ? 4 : 2) + 1;
    if (r.left < 16) pointNum = 0;
    else if (pointNum > (r.left - 16) / ps) pointNum = Math.floor((r.left - 16) / ps);
    r.skip(16);
    const pts = [];
    for (let i = 0; i < pointNum; i++) {
      const x = coordOf(r, version);
      const y = coordOf(r, version);
      pts.push({ x, y });
    }
    const types = [];
    for (let i = 0; i < pointNum; i++) types.push(r.u8());
    return { paths: [{ segs: processPath(pts, types), closed: isClosed(types) }] };
  }

  function readLineAndCurve(r, version) {
    const pointNum = r.u16();
    const ps = 2 * (version >= 600 ? 4 : 2) + 1;
    let n = pointNum;
    if (!n || n > r.left / ps) n = Math.floor(r.left / ps);
    r.skip(2);
    const pts = [];
    for (let i = 0; i < n; i++) {
      const x = coordOf(r, version);
      const y = coordOf(r, version);
      pts.push({ x, y });
    }
    const types = [];
    for (let i = 0; i < n; i++) types.push(r.u8());
    return { paths: [{ segs: processPath(pts, types), closed: isClosed(types) }] };
  }

  function readPolygonCoords(r, version) {
    // polygon spoke: single u16 count, 2-byte skip (like line & curve)
    const pointNum = r.u16();
    const ps = 2 * (version >= 600 ? 4 : 2) + 1;
    let n = pointNum;
    if (n > r.left / ps) n = Math.floor(r.left / ps);
    r.skip(2);
    const pts = [];
    for (let i = 0; i < n; i++) {
      const x = coordOf(r, version);
      const y = coordOf(r, version);
      pts.push({ x, y });
    }
    const types = [];
    for (let i = 0; i < n; i++) types.push(r.u8());
    return { paths: [{ segs: processPath(pts, types), closed: isClosed(types) }] };
  }

  function isClosed(types) {
    for (let i = 0; i < types.length; i++) if (types[i] & 0x08) return true;
    return false;
  }

  function processPath(points, types) {
    const segs = [];
    let tmp = [];
    let closed = false;
    for (let k = 0; k < points.length; k++) {
      const type = types[k] || 0;
      closed = !!(type & 0x08);
      const px = points[k].x, py = points[k].y;
      if (!(type & 0x40) && !(type & 0x80)) {
        if (closed) segs.push({ type: 'Z' });
        tmp = [];
        segs.push({ type: 'M', x: px, y: py });
      } else if ((type & 0x40) && !(type & 0x80)) {
        tmp = [];
        segs.push({ type: 'L', x: px, y: py });
        if (closed) segs.push({ type: 'Z' });
      } else if (!(type & 0x40) && (type & 0x80)) {
        if (tmp.length >= 2) {
          segs.push({ type: 'C', x: px, y: py, c1: tmp[0], c2: tmp[1] });
        } else {
          segs.push({ type: 'L', x: px, y: py });
        }
        if (closed) segs.push({ type: 'Z' });
        tmp = [];
      } else {
        tmp.push({ x: px, y: py });
      }
    }
    if (closed) segs.push({ type: 'Z' });
    return segs;
  }

  function readArtisticText(r, version) {
    const x = coordOf(r, version);
    const y = coordOf(r, version);
    return { paths: [{ textAnchor: { x, y }, text: null }] };
  }

  function readParagraphText(r, version) {
    r.skip(4);
    const w = coordOf(r, version);
    const h = coordOf(r, version);
    return { paths: [{ textAnchor: { x: 0, y: 0 }, text: null, paraW: w, paraH: h }] };
  }

  function mapKind(chunkType, geometry) {
    if (geometry.text) return 'text';
    const p = geometry.paths[0];
    if (!p) return 'path';
    if (chunkType === 0x01 && !geometry.rounded) return 'rect';
    if (chunkType === 0x02 && p.ellipse) return 'ellipse';
    if (chunkType === 0x04 || chunkType === 0x06) return 'text';
    return 'path';
  }

  /* ══════════════ 9. transform + model assembly ══════════════ */

  function findTransform(node) {
    // trfl LIST containing trfd
    const trfl = findAll([node], 'trfl')[0];
    const holder = trfl || node;
    const trfd = findAll([holder], 'trfd')[0];
    return trfd;
  }

  function readTrfd(node, version) {
    const r = new R(node.buf, node.body, node.end);
    const start = r.p;
    try {
      const chunkLength = r.u32();
      const numArgs = r.u32();
      const startOfArgs = r.u32();
      if (numArgs > 64 || startOfArgs >= chunkLength) return null;
      const offsets = [];
      r.seek(start + startOfArgs);
      for (let i = 0; i < numArgs; i++) offsets.push(r.u32());
      for (const off of offsets) {
        r.seek(start + off);
        if (version >= 1300) r.skip(8);
        const type = r.u16();
        if (type === 0x08) {
          if (version >= 600) r.skip(6);
          const a = r.f64(), c = r.f64(), txRaw = r.f64();
          const b = r.f64(), d = r.f64(), tyRaw = r.f64();
          const div = version >= 600 ? MM_DIV_32 : MM_DIV_16;
          return { a, b, c, d, tx: txRaw / div, ty: tyRaw / div };
        }
        if (type === 0x10) { // translate-only
          if (version >= 600) r.skip(2);
          const x = version >= 600 ? r.s32() / MM_DIV_32 : r.s32() / MM_DIV_16;
          const y = version >= 600 ? r.s32() / MM_DIV_32 : r.s32() / MM_DIV_16;
          return { a: 1, b: 0, c: 0, d: 1, tx: x, ty: y };
        }
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  function applyMatrix(m, x, y) {
    return { x: m.a * x + m.c * y + m.tx, y: m.b * x + m.d * y + m.ty };
  }

  function finishObjects(rawObjects, pageW, pageH) {
    const out = [];
    for (const o of rawObjects) {
      try {
        const obj = buildObject(o, pageW, pageH);
        if (obj) out.push(obj);
      } catch (e) { /* skip broken object */ }
    }
    return out;
  }

  function buildObject(raw, pageW, pageH) {
    const m = raw.transform || { a: 1, b: 0, c: 0, d: 1, tx: 0, ty: 0 };
    const identity = Math.abs(m.a - 1) < 1e-6 && Math.abs(m.b) < 1e-6 &&
      Math.abs(m.c) < 1e-6 && Math.abs(m.d - 1) < 1e-6;
    const axis = Math.abs(m.b) < 1e-6 && Math.abs(m.c) < 1e-6;

    const style = {
      fill: raw.fill || { type: 'none', color: '#cccccc' },
      stroke: raw.stroke || { type: 'none', color: '#000000', w: 0.25, dash: 'solid', cap: 'butt', join: 'miter' },
      transparency: raw.opacity == null ? 0 : Math.max(0, Math.min(100, 100 - raw.opacity)),
      blend: 'normal'
    };

    const P = raw.paths;

    // rectangle (native)
    if (raw.chunkType === 0x01 && P.length === 1 && P[0].rect && axis) {
      const x0 = P[0].x0, y0 = P[0].y0;
      const w = Math.abs(x0 * m.a), h = Math.abs(y0 * m.d);
      const cx = m.tx + x0 * m.a / 2, cy = m.ty + y0 * m.d / 2;
      return mkObj('rect', cx, cy, pageW, pageH, w, h, { rx: 0 }, style);
    }

    // ellipse (native)
    if (raw.chunkType === 0x02 && P.length === 1 && P[0].ellipse && axis) {
      const e = P[0];
      const cx = m.tx + e.cx * m.a, cy = m.ty + e.cy * m.d;
      return mkObj('ellipse', cx, cy, pageW, pageH, Math.abs(e.rx * 2 * m.a), Math.abs(e.ry * 2 * m.d), { mode: 'ellipse', start: 0, end: 360 }, style);
    }

    // embedded bitmap (chunk type 0x05) — place the decoded image on its rect
    if (raw.chunkType === 0x05 && raw.bitmap) {
      const bm = raw.bitmap;
      const bx0 = Math.min(bm.x1, bm.x2), bx1 = Math.max(bm.x1, bm.x2);
      const by0 = Math.min(bm.y1, bm.y2), by1 = Math.max(bm.y1, bm.y2);
      const p1 = applyMatrix(m, bx0, by0), p2 = applyMatrix(m, bx1, by1);
      const cx = (p1.x + p2.x) / 2, cy = (p1.y + p2.y) / 2;
      const w = Math.abs(p2.x - p1.x), h = Math.abs(p2.y - p1.y);
      const img = raw._styles && raw._styles.bmps ? raw._styles.bmps.get(bm.imageId) : null;
      const st = { fill: { type: 'none' }, stroke: { type: 'none', color: '#000000', w: 0.25, dash: 'solid', cap: 'butt', join: 'miter' }, transparency: 0, blend: 'normal' };
      if (!img || !w || !h) return null;
      const obj = mkObj('image', cx, cy, pageW, pageH, w, h, { src: img.src }, st);
      obj.name = 'Bitmap';
      return obj;
    }

    // polygon / star: expand the spoke into the full outline (libcdr CDRPolygon)
    if (raw.polyTransform && P.length === 1 && P[0].segs) {
      const expanded = buildPolygonPath(P[0].segs, raw.polyTransform);
      if (expanded) {
        const ringList = segsToRings(normalizeSegs(expanded.segs, true), true);
        const outRings = [];
        for (const ring of ringList) {
          if (!ring.anchors.length) continue;
          outRings.push(transformRing(ring, m, pageW, pageH));
        }
        if (outRings.length) {
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          for (const r of outRings) for (const a of r.anchors) {
            minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x);
            minY = Math.min(minY, a.y); maxY = Math.max(maxY, a.y);
          }
          const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
          for (const r of outRings) for (const a of r.anchors) { a.x -= cx; a.y -= cy; }
          return mkObjPage('path', cx, cy, Math.max(0.05, maxX - minX), Math.max(0.05, maxY - minY),
            { rings: outRings, fillRule: 'evenodd' }, style,
            raw.polyTransform.nextPoint > 1 ? 'Star' : 'Polygon');
        }
      }
    }

    // artistic / paragraph text
    const anchorPt = P.length === 1 ? P[0].textAnchor : null;
    if (anchorPt && (raw.textData || raw.chunkType === 0x04 || raw.chunkType === 0x06)) {
      const t = raw.textData || { text: '', size: 0, fontId: 0, fillColor: null };
      const text = (t.text || '').replace(/\r/g, '');
      if (!text.trim()) return null;
      const fmap = raw._styles && raw._styles.fontMap;
      const stl = raw._styles && raw._styles.stlFontMap;
      const fontRec = (stl && t.styleId) ? stl.get(t.styleId) : null;
      let sizeVal = t.size || (fontRec && fontRec.size) || 0;
      // CDR stores the em size in millimetres; keep it in a printable range and
      // fall back to 9 pt when the record is missing or obviously corrupt.
      if (!isFinite(sizeVal) || sizeVal <= 0.1 || sizeVal > 150) sizeVal = 3.175; // 9 pt
      const fsMm = Math.max(0.4, sizeVal);
      const pt = fsMm * 72 / 25.4;
      const lines = text.split('\n');
      let wEst = Math.max(...lines.map(l => l.length)) * fsMm * 0.52;
      let hEst = lines.length * fsMm * 1.22;
      let left, baseline;
      if (raw.bbox) {
        // libcdr places the text frame at (bbox.minX, bbox.minY) in CDR coords;
        // the page flip turns minY into the baseline of the first line.
        left = raw.bbox.x0 + pageW / 2;
        baseline = pageH / 2 - raw.bbox.y0;
        wEst = Math.max(wEst, raw.bbox.x1 - raw.bbox.x0);
        hEst = Math.max(hEst, raw.bbox.y1 - raw.bbox.y0);
      } else {
        const p = applyMatrix(m, anchorPt.x, anchorPt.y);
        left = p.x + pageW / 2;
        baseline = pageH / 2 - p.y;
      }
      const cx = left;
      const cy = baseline;
      let fillHex = t.fillColor || null;
      if (!fillHex && raw._styles && t.styleId) {
        const fId = raw._styles.stlFills.get(t.styleId);
        const fRec = fId ? raw._styles.fills.get(fId) : null;
        if (fRec && fRec.type === 'solid' && fRec.color) fillHex = fRec.color;
      }
      if (!fillHex && raw.fill && raw.fill.type === 'solid' && raw.fill.color) fillHex = raw.fill.color;
      if (!fillHex) fillHex = '#000000';
      return {
        kind: 'text', name: 'Text',
        x: cx, y: cy, w: Math.max(1, wEst), h: Math.max(1, hEst),
        rot: 0, sx: 1, sy: 1,
        props: {
          text, font: (fontRec && fmap && fmap.get(fontRec.fontId)) || (fmap && fmap.get(t.fontId)) || 'Arial',
          size: U_round(pt, 2), bold: false, italic: false, underline: false,
          align: 'left', lineHeight: 1.25, letterSpacing: 0, cdrAnchor: true
        },
        style: {
          fill: { type: 'solid', color: fillHex, angle: 0, stops: [{ at: 0, color: '#ffffff' }, { at: 1, color: '#149fd6' }] },
          stroke: { type: 'none', color: '#000000', w: 0.25, dash: 'solid', cap: 'butt', join: 'miter' },
          transparency: 0, blend: 'normal'
        },
        effects: { shadow: { on: false, dx: 2, dy: -2, blur: 3, color: '#000000', opacity: 0.4 } },
        locked: false, hidden: false, children: null, _v: 1, _measured: null, _cdr: true
      };
    }

    // build model path rings in page-MM, Y-down
    const rings = [];
    for (const p of P) {
      try {
        if (p.rect) {
          const x0 = p.x0, y0 = p.y0;
          const r = rectangleRing(x0, y0);
          rings.push(transformRing(r, m, pageW, pageH));
        } else if (p.ellipse) {
          const r = ellipseRing(p.cx, p.cy, p.rx, p.ry);
          rings.push(transformRing(r, m, pageW, pageH));
        } else if (p.segs) {
          for (const r of segsToRings(normalizeSegs(p.segs, p.closed), p.closed)) {
            if (r && r.anchors.length) rings.push(transformRing(r, m, pageW, pageH));
          }
        }
      } catch (e) { /* skip ring */ }
    }
    if (!rings.length) return null;

    const anchorList = [];
    for (const r of rings) for (const a of r.anchors) anchorList.push(a);
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const a of anchorList) {
      minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x);
      minY = Math.min(minY, a.y); maxY = Math.max(maxY, a.y);
    }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const w = Math.max(0.05, maxX - minX), h = Math.max(0.05, maxY - minY);
    for (const r of rings) {
      for (const a of r.anchors) {
        a.x -= cx; a.y -= cy;
        if (a.hIn) { a.hIn = { x: a.hIn.x, y: a.hIn.y }; }
        if (a.hOut) { a.hOut = { x: a.hOut.x, y: a.hOut.y }; }
      }
    }
    return mkObjPage('path', cx, cy, w, h, { rings, fillRule: 'evenodd' }, style);
  }

  function rotSegs(segs, t) {
    const c = Math.cos(t), s = Math.sin(t);
    const rp = p => p ? { x: c * p.x + s * p.y, y: -s * p.x + c * p.y } : p;
    return segs.map(sg => {
      const o = { type: sg.type };
      if (sg.x !== undefined) { const q = rp(sg); o.x = q.x; o.y = q.y; }
      if (sg.c1) o.c1 = rp(sg.c1);
      if (sg.c2) o.c2 = rp(sg.c2);
      return o;
    });
  }

  function buildPolygonPath(segs, pt) {
    const n = pt.numAngles | 0;
    let np = pt.nextPoint | 0;
    if (!n || n > 512) return null;
    if (!np) np = 1;
    const step = 2 * Math.PI / n;
    const out = [];
    const sub = segs.filter(s2 => s2.type !== 'Z');
    if (!sub.length) return null;
    if (np > 1 && n % np) {
      let tmp = sub.slice();
      out.push(...tmp);
      for (let i = 1; i < n; i++) {
        tmp = rotSegs(tmp, np * step);
        out.push(...tmp);
      }
    } else {
      // libcdr: the original sub-path is already in `path`; append the rotated copies
      const base = sub.slice();
      out.push(...base);
      let tmp = sub.slice();
      for (let i = 0; i < np; i++) {
        if (i) { tmp = rotSegs(tmp, step); out.push(...tmp); }
        for (let j = 1; j < n / np; j++) {
          tmp = rotSegs(tmp, np * step);
          out.push(...tmp);
        }
        out.push({ type: 'Z' });
      }
    }
    out.push({ type: 'Z' });
    // scale + translate
    for (const sg of out) {

      if (sg.c1) { sg.c1 = { x: sg.c1.x * pt.rx + pt.cx, y: sg.c1.y * pt.ry + pt.cy }; }

    }

    try {
      window.cdrLastImport = {
        file: fname, objects: total, rescuedStyles: rescued, reframedPages: reframed,
        at: new Date().toISOString()
      };
      console.info('[CDR] import', window.cdrLastImport);
    } catch (e) {}
    return total;
  }

  async function importCDRFile(buf, fname) {
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const engine = window.CDR;
    let res = null, err = null;

    if (engine && typeof engine.parse === 'function') {
      try { res = engine.parse(u8); }
      catch (e) { err = e; }
    } else {
      err = new Error('CDR engine load nahi hua');
    }

    if (res && res.objects && res.objects.length) {
      const n = await finalizeCDRPages(
        [{ w: res.pageW, h: res.pageH, objects: res.objects }],
        fname
      );
      const verMaj = Math.round((res.version || 0) / 100) || '?';
      const where = CONTAINERS[res.container] || res.container || 'RIFF';
      const kinds = res.objects.reduce((a, o) => { a[o.kind] = (a[o.kind] || 0) + 1; return a; }, {});
      const summary = Object.keys(kinds).map(k => kinds[k] + ' ' + k).join(' · ');
      toast(
        'CorelDRAW import ✅ ' + n + ' editable objects — ' + summary +
        ' · CDR v' + verMaj + ' (' + where + ') · page ' +
        Math.round(res.pageW) + '×' + Math.round(res.pageH) + ' mm · text + nodes + gradients editable',
        'ok', 7000
      );
      return n;
    }

    let verCh = '?';
    try {
      const head = String.fromCharCode(u8[0], u8[1], u8[2], u8[3]);
      verCh = head === 'RIFF' ? String.fromCharCode(u8[11] || 0x30) : '?';
    } catch (e) {}
    try { if (await previewFallback(u8, fname, verCh)) return 'preview'; } catch (e) {}

    const tooLong = (((res && res.warnings) || []).filter(Boolean).slice(0, 1).join(' ') || '');
    const hints = tooLong.length > 200 ? '' : tooLong;
    const rawMsg = (err && err.message) || (typeof err === 'string' ? err : '');
    const reason = rawMsg ? rawMsg.replace(/\s*\.\s*$/, '') + '.' : '';
    const notCdr = /does not look like|not a CorelDRAW|signature/i.test(rawMsg);
    const head = notCdr
      ? ['Ye file CorelDRAW (.cdr) jaisi nahi lagti.', reason]
      : ['Is CDR me editable content nahi mila.', reason || 'Parser ko koi recognised object nahi mila.'];
    if (hints) head.push(hints);
    head.push('File: ' + (fname || 'unknown') + (res && res.version ? ' · CDR v' + Math.round(res.version / 100) : ''));
    failDialog('file nahi khul payi', head, fname);
    throw new Error(head.join(' '));
  }

  /* ── expose (replaces the v9.9 preview-only stub) ── */
  window.importCDRFile = importCDRFile;
  window._finalizeCDRPages = finalizeCDRPages;
  window.cdrConvertObjects = convertObjects;

  /* ── repair: T_vec() was referenced by the PDF/EPS/AI pipeline but never defined ── */
  if (typeof window.T_vec !== 'function') {
    window.T_vec = function T_vec(name) {
      const L = newVectorLayer(name || 'Imported');
      doc.layers.push(L);
      doc.activeId = L.id;
      return L;
    };
  }

  window.__cdrBridge = { version: '10.0', convertObjects, fillToApp, strokeToApp, finalizeCDRPages };
})();

</script>
