/* ---------- selection state ---------- */
let pixSel=null,_maskC=null,_clone={src:null},_dab=null,_dab2=null;
let antsTimer=null;
function startAnts(){if(antsTimer)return;antsTimer=setInterval(()=>{if(pixSel)needRender=true},120)}
function stopAnts(){if(antsTimer){clearInterval(antsTimer);antsTimer=null}}
function countSel(){if(!pixSel)return 0;let n=0;const b=pixSel.bbox;
  for(let y=b.y;y<=b.y2;y++){const row=y*doc.w;for(let x=b.x;x<=b.x2;x++)if(pixSel.mask[row+x])n++}return n}
function setPixSel(mask){
  commitFloat();
  let x=1e9,y=1e9,x2=-1e9,y2=-1e9;
  for(let yy=0;yy<doc.h;yy++){const row=yy*doc.w;
    for(let xx=0;xx<doc.w;xx++){if(mask[row+xx]){if(xx<x)x=xx;if(xx>x2)x2=xx;if(yy<y)y=yy;if(yy>y2)y2=yy}}}
  if(x2<0){pixSel=null;_maskC=null;stopAnts();needRender=true;uiProps();return}
  pixSel={mask,bbox:{x,y,x2,y2},ants:traceMaskLoops(mask,doc.w,doc.h),float:null};
  _maskC=null;startAnts();needRender=true;uiProps()}
function clearPixSel(){commitFloat();pixSel=null;_maskC=null;stopAnts();needRender=true;uiProps()}
function invertSel(){
  if(!pixSel){selectAllPixels();return}
  const m=pixSel.mask;for(let i=0;i<m.length;i++)m[i]=m[i]?0:255;
  setPixSel(m)}
function selectAllPixels(){
  if(!doc)return;
  const m=new Uint8Array(doc.w*doc.h);m.fill(255);setPixSel(m)}
function combineSelMask(m,add,sub){
  if(!pixSel||(!add&&!sub)){setPixSel(m);return}
  const old=pixSel.mask;const out=new Uint8Array(m.length);
  if(add){for(let i=0;i<m.length;i++)out[i]=(m[i]||old[i])?255:0}
  else{for(let i=0;i<m.length;i++)out[i]=(old[i]&&!m[i])?255:0}
  setPixSel(out)}
function ptInSelRect(p){return !!(pixSel&&p.x>=pixSel.bbox.x&&p.x<=pixSel.bbox.x2+1&&p.y>=pixSel.bbox.y&&p.y<=pixSel.bbox.y2+1)}
function maskCanvas(){
  if(_maskC)return _maskC;
  const c=mkCanvas(doc.w,doc.h);const g=c.getContext('2d');
  const img=g.createImageData(doc.w,doc.h);
  for(let i=0;i<pixSel.mask.length;i++)if(pixSel.mask[i])img.data[i*4+3]=255;
  g.putImageData(img,0,0);_maskC=c;return c}
function restoreOutside(d,orig){
  if(!pixSel)return;const b=pixSel.bbox,W=doc.w,m=pixSel.mask;
  for(let y=b.y;y<=b.y2;y++){const row=y*W;
    for(let x=b.x;x<=b.x2;x++){const i=row+x;
      if(!m[i]){const j=i*4;d[j]=orig[j];d[j+1]=orig[j+1];d[j+2]=orig[j+2];d[j+3]=orig[j+3]}}}}
function normRect(a,b){return{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)}}
function rectMask(r){
  const m=new Uint8Array(doc.w*doc.h);
  const x0=clamp(Math.floor(r.x),0,doc.w-1),x1=clamp(Math.ceil(r.x+r.w)-1,0,doc.w-1);
  const y0=clamp(Math.floor(r.y),0,doc.h-1),y1=clamp(Math.ceil(r.y+r.h)-1,0,doc.h-1);
  for(let y=y0;y<=y1;y++){const row=y*doc.w;for(let x=x0;x<=x1;x++)m[row+x]=255}
  return m}
function ellipseMask(r){
  const m=new Uint8Array(doc.w*doc.h);
  if(r.w<=0||r.h<=0)return m;
  const cx=r.x+r.w/2,cy=r.y+r.h/2,rx=r.w/2,ry=r.h/2;
  const x0=clamp(Math.floor(r.x),0,doc.w-1),x1=clamp(Math.ceil(r.x+r.w)-1,0,doc.w-1);
  const y0=clamp(Math.floor(r.y),0,doc.h-1),y1=clamp(Math.ceil(r.y+r.h)-1,0,doc.h-1);
  for(let y=y0;y<=y1;y++){const dy=(y+.5-cy)/ry;const row=y*doc.w;
    for(let x=x0;x<=x1;x++){const dx=(x+.5-cx)/rx;if(dx*dx+dy*dy<=1)m[row+x]=255}}
  return m}
function floodScan(px,W,H,x0,y0,match){
  const seen=new Uint8Array(W*H);
  const at=(x,y)=>(y*W+x)*4;
  const stack=[[x0,y0]];
  while(stack.length){
    let[x,y]=stack.pop();let i=at(x,y);
    while(x>=0&&match(i)){x--;i-=4}
    x++;i+=4;let up=false,down=false;
    while(x<W&&match(i)){
      if(!seen[y*W+x]){seen[y*W+x]=1;
        if(y>0&&!seen[(y-1)*W+x]&&match(at(x,y-1))){if(!up){stack.push([x,y-1]);up=true}}else up=false;
        if(y<H-1&&!seen[(y+1)*W+x]&&match(at(x,y+1))){if(!down){stack.push([x,y+1]);down=true}}else down=false}
      x++;i+=4}}
  return seen}
function wandMask(L,p,tol){
  bakeOffset(L);
  const x0=Math.floor(p.x-L.offset.x),y0=Math.floor(p.y-L.offset.y);
  if(x0<0||y0<0||x0>=doc.w||y0>=doc.h)return null;
  const px=L.canvas.getContext('2d').getImageData(0,0,doc.w,doc.h).data;
  const si=(y0*doc.w+x0)*4;
  const tr=px[si],tg=px[si+1],tb=px[si+2],ta=px[si+3];
  const match=i=>Math.abs(px[i]-tr)<=tol&&Math.abs(px[i+1]-tg)<=tol&&Math.abs(px[i+2]-tb)<=tol&&Math.abs(px[i+3]-ta)<=tol;
  return floodScan(px,doc.w,doc.h,x0,y0,match)}

/* ---------- selection move (floating pixels) ---------- */
function startFloatDrag(L,p){
  pushUndo();
  const mc=maskCanvas();
  const fc=mkCanvas(doc.w,doc.h);
  const fg=fc.getContext('2d');
  fg.drawImage(L.canvas,L.offset.x,L.offset.y);
  fg.globalCompositeOperation='destination-in';fg.drawImage(mc,0,0);
  const lg=L.canvas.getContext('2d');
  lg.save();lg.globalCompositeOperation='destination-out';lg.drawImage(mc,-L.offset.x,-L.offset.y);lg.restore();
  pixSel.float={layer:L,canvas:fc,dx:0,dy:0};
  layerVerBump(L);docDirty=true;needRender=true}
function commitFloat(){
  const f=pixSel&&pixSel.float;if(!f)return;
  const g=f.layer.canvas.getContext('2d');
  g.drawImage(f.canvas,Math.round(f.dx-f.layer.offset.x),Math.round(f.dy-f.layer.offset.y));
  pixSel.float=null;layerVerBump(f.layer);docDirty=true;needRender=true;uiLayersRefresh()}
function revertFloat(){
  const f=pixSel&&pixSel.float;if(!f)return;
  const g=f.layer.canvas.getContext('2d');
  g.drawImage(f.canvas,-f.layer.offset.x,-f.layer.offset.y);
  pixSel.float=null;layerVerBump(f.layer);docDirty=true;needRender=true;uiLayersRefresh()}
function selToNewLayer(){
  if(!pixSel){toast('Pehle pixel selection banao (M ya W tool)');return}
  const L=activeLayer();
  if(!L||L.type!=='raster'){toast('Bitmap layer select karo');return}
  commitFloat();pushUndo();
  const c=mkCanvas(doc.w,doc.h);const g=c.getContext('2d');
  g.drawImage(L.canvas,L.offset.x,L.offset.y);
  g.globalCompositeOperation='destination-in';g.drawImage(maskCanvas(),0,0);
  const NL=newRasterLayer(L.name+' selection');
  NL.canvas=c;NL.offset={x:0,y:0};layerVerBump(NL);
  insertLayer(NL,L);uiLayers();docDirty=true;needRender=true;
  toast('Selection naye layer pe copy ho gaya','ok')}

/* ---------- new tools ---------- */
TOOLS.marquee={cursor:'crosshair',
  down(p,e){commitFloat();G.marq={a:p,b:null,mode:opts.marqueeMode,add:e.shiftKey,sub:e.altKey}},
  move(p){if(G.marq){G.marq.b=p;needRender=true}},
  up(p){const mq=G.marq;G.marq=null;if(!mq)return;
    const r=normRect(mq.a,p||mq.a);
    if(r.w<3&&r.h<3){clearPixSel();needRender=true;return}
    const m=mq.mode==='ellipse'?ellipseMask(r):rectMask(r);
    combineSelMask(m,mq.add,mq.sub);needRender=true}};
TOOLS.wand={cursor:'crosshair',
  down(p,e){commitFloat();
    const L=activeLayer();
    if(!L||L.type!=='raster'){toast('Magic Wand bitmap layer par chalta hai — layer select karo');return}
    const m=wandMask(L,p,opts.wandTol);
    if(!m)return;
    combineSelMask(m,e.shiftKey,e.altKey);needRender=true},
  move(){},up(){}};
TOOLS.smudge={cursor:'none',
  down(p){commitFloat();
    const L=ensureRasterLayer();bakeOffset(L);pushUndo();
    G.smudge={L,last:{x:p.x,y:p.y},pre:pixSel?cloneCanvas(L.canvas):null};
    const r=opts.smudgeSize/2;_dab=mkCanvas(Math.ceil(r*2)+2,Math.ceil(r*2)+2)},
  move(p){const S=G.smudge;if(!S)return;
    const r=opts.smudgeSize/2;
    const steps=Math.max(1,Math.ceil(dist(S.last,p)/(r*.35)));
    for(let i=1;i<=steps;i++){const t=i/steps;
      smudgeStep(S.L,S.last,{x:lerp(S.last.x,p.x,t),y:lerp(S.last.y,p.y,t)},r)}
    S.last={x:p.x,y:p.y};docDirty=true;needRender=true},
  up(){const S=G.smudge;if(!S)return;
    if(S.pre&&pixSel)applyMaskMerge(S.L,S.pre,S.L.canvas);
    G.smudge=null;uiLayersRefresh()}};
TOOLS.clone={cursor:'crosshair',
  down(p,e){
    if(e.altKey){_clone.src={x:p.x,y:p.y};toast('Clone source set — ab drag karke paint karo','ok',2200);needRender=true;return}
    if(!_clone.src){toast('Pehle Alt+Click se SOURCE point set karo','ok',2600);return}
    commitFloat();
    const L=ensureRasterLayer();bakeOffset(L);pushUndo();
    G.cloneStroke={L,tmp:mkCanvas(doc.w,doc.h),start:{x:p.x,y:p.y},last:{x:p.x,y:p.y}};
    _dab2=mkCanvas(Math.ceil(opts.cloneSize)+2,Math.ceil(opts.cloneSize)+2);
    docDirty=true},
  move(p){const S=G.cloneStroke;if(!S)return;
    const r=opts.cloneSize/2;
    const steps=Math.max(1,Math.ceil(dist(S.last,p)/(r*.3)));
    for(let i=1;i<=steps;i++){const t=i/steps;
      cloneDab(S,{x:lerp(S.last.x,p.x,t),y:lerp(S.last.y,p.y,t)},r)}
    S.last={x:p.x,y:p.y};docDirty=true;needRender=true},
  up(){const S=G.cloneStroke;if(!S)return;
    if(pixSel){const tg=S.tmp.getContext('2d');
      tg.save();tg.globalCompositeOperation='destination-in';tg.drawImage(maskCanvas(),0,0);tg.restore()}
    const g=S.L.canvas.getContext('2d');
    g.drawImage(S.tmp,0,0);
    layerVerBump(S.L);G.cloneStroke=null;docDirty=true;needRender=true;uiLayersRefresh()}};
function smudgeStep(L,from,to,r){
  const dg=_dab.getContext('2d');
  dg.setTransform(1,0,0,1,0,0);
  dg.clearRect(0,0,_dab.width,_dab.height);
  dg.drawImage(L.canvas,from.x-r,from.y-r,r*2,r*2,0,0,r*2,r*2);
  dg.globalCompositeOperation='destination-in';
  const soft=opts.smudgeSoft/100;
  const gr=dg.createRadialGradient(r,r,r*Math.max(.05,1-soft),r,r,r);
  gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');
  dg.fillStyle=gr;dg.fillRect(0,0,r*2,r*2);
  dg.globalCompositeOperation='source-over';
  const g=L.canvas.getContext('2d');
  g.save();g.globalAlpha=opts.smudgeStr/100;
  g.drawImage(_dab,to.x-r,to.y-r);g.restore()}
function cloneDab(S,pos,r){
  const sx=_clone.src.x+(pos.x-S.start.x),sy=_clone.src.y+(pos.y-S.start.y);
  if(sx<-r||sy<-r||sx>=doc.w+r||sy>=doc.h+r)return;
  const dg=_dab2.getContext('2d');
  dg.setTransform(1,0,0,1,0,0);
  dg.clearRect(0,0,_dab2.width,_dab2.height);
  dg.drawImage(S.L.canvas,sx-r,sy-r,r*2,r*2,0,0,r*2,r*2);
  dg.globalCompositeOperation='destination-in';
  const soft=opts.cloneSoft/100;
  const gr=dg.createRadialGradient(r,r,r*Math.max(.05,1-soft),r,r,r);
  gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');
  dg.fillStyle=gr;dg.fillRect(0,0,r*2,r*2);
  dg.globalCompositeOperation='source-over';
  S.tmp.getContext('2d').drawImage(_dab2,pos.x-r,pos.y-r)}
function applyMaskMerge(L,pre,current){
  const mc=maskCanvas();
  const ins=cloneCanvas(current);
  const ig=ins.getContext('2d');
  ig.globalCompositeOperation='destination-in';ig.drawImage(mc,0,0);
  const out=cloneCanvas(pre);
  const og=out.getContext('2d');
  og.globalCompositeOperation='destination-out';og.drawImage(mc,0,0);
  og.globalCompositeOperation='source-over';og.drawImage(ins,0,0);
  L.canvas=out;layerVerBump(L);docDirty=true;needRender=true}

/* ---------- selection-aware rewrites ---------- */
function withPixels(L,fn){
  const g=L.canvas.getContext('2d');
  const img=g.getImageData(0,0,doc.w,doc.h);
  const orig=pixSel?new Uint8ClampedArray(img.data):null;
  fn(img.data,doc.w,doc.h);
  if(orig)restoreOutside(img.data,orig);
  g.putImageData(img,0,0);layerVerBump(L);docDirty=true;needRender=true;uiLayersRefresh()}
function floodFill(layer,p){
  commitFloat();bakeOffset(layer);pushUndo();
  const x0=Math.floor(p.x-layer.offset.x),y0=Math.floor(p.y-layer.offset.y);
  if(x0<0||y0<0||x0>=doc.w||y0>=doc.h){undoStack.pop();uiQuick();return}
  const g=layer.canvas.getContext('2d');
  const img=g.getImageData(0,0,doc.w,doc.h);const px=img.data;
  const si=(y0*doc.w+x0)*4;
  const tr=px[si],tg=px[si+1],tb=px[si+2],ta=px[si+3];
  const c=hexToRgb(primary);const tol=opts.fillTol;
  if(tr===c.r&&tg===c.g&&tb===c.b&&ta===255){undoStack.pop();uiQuick();toast('Wahan pehle se yehi color hai');return}
  const match=i=>Math.abs(px[i]-tr)<=tol&&Math.abs(px[i+1]-tg)<=tol&&Math.abs(px[i+2]-tb)<=tol&&Math.abs(px[i+3]-ta)<=tol;
  const seen=floodScan(px,doc.w,doc.h,x0,y0,match);
  if(pixSel){for(let i=0;i<seen.length;i++)if(seen[i]&&!pixSel.mask[i])seen[i]=0}
  for(let i=0;i<seen.length;i++)if(seen[i]){const j=i*4;px[j]=c.r;px[j+1]=c.g;px[j+2]=c.b;px[j+3]=255}
  g.putImageData(img,0,0);layerVerBump(layer);docDirty=true;needRender=true;uiLayersRefresh()}
function strokeBegin(layer,p,st){
  commitFloat();
  bakeOffset(layer);
  pushUndo();
  const tmp=mkCanvas(doc.w,doc.h);
  G.stroke={layer,tmp,mode:st.eraser?'destination-out':'source-over',opacity:st.opacity/100,st,last:{x:p.x,y:p.y}};
  stampSegment(tmp,null,{x:p.x,y:p.y},st);docDirty=true}
function strokeEnd(){const S=G.stroke;if(!S)return;
  S.tmp=symRasterCombine(S.tmp);
  if(pixSel){const tg=S.tmp.getContext('2d');
    tg.save();tg.globalCompositeOperation='destination-in';tg.drawImage(maskCanvas(),0,0);tg.restore()}
  const onMask=(typeof maskEditId!=='undefined')&&maskEditId===S.layer.id&&!!(S.layer.mask&&S.layer.mask.enabled);

function stackBlur(g,L){
  const tmp=cloneCanvas(L.canvas);

function drawAnts(g){
  g.save();g.translate(panX,panY);g.scale(zoom,zoom);
  g.lineWidth=1/zoom;
  const ph=-(Date.now()/80)%7/zoom;
  for(const loop of pixSel.ants){
    if(loop.length<3)continue;
    g.setLineDash([4/zoom,3/zoom]);
    g.lineDashOffset=ph;g.strokeStyle='rgba(0,0,0,.9)';
    antsStroke(g,loop);
    g.lineDashOffset=ph+3.5/zoom;g.strokeStyle='rgba(255,255,255,.95)';
    antsStroke(g,loop)}
  g.setLineDash([]);g.restore()}
function antsStroke(g,loop){
  g.beginPath();g.moveTo(loop[0].x,loop[0].y);
  for(let i=1;i<loop.length;i++)g.lineTo(loop[i].x,loop[i].y);
  g.closePath();g.stroke()}
function drawMarqueeDraft(g){
  const a=G.marq.a,b=G.marq.b;
  const x=Math.min(a.x,b.x)*zoom+panX,y=Math.min(a.y,b.y)*zoom+panY;
  const w=Math.abs(b.x-a.x)*zoom,h=Math.abs(b.y-a.y)*zoom;
  g.save();g.lineWidth=1;
  for(const[col,off]of[['rgba(0,0,0,.85)',0],['rgba(255,255,255,.95)',4]]){
    g.strokeStyle=col;g.setLineDash([4,3]);g.lineDashOffset=off;
    g.beginPath();
    if(G.marq.mode==='ellipse')g.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,TAU);
    else g.rect(x,y,w,h);

function drawCloneSrc(g){
  const s=_clone.src;
  let dp=docToScreen(s);
  if(G.cloneStroke&&hoverDoc)dp=docToScreen({x:s.x+(hoverDoc.x-G.cloneStroke.start.x),y:s.y+(hoverDoc.y-G.cloneStroke.start.y)});
  g.save();g.strokeStyle='#3ecf8e';g.lineWidth=1.4;
  g.beginPath();g.arc(dp.x,dp.y,7,0,TAU);g.stroke();
  g.beginPath();
  g.moveTo(dp.x-11,dp.y);g.lineTo(dp.x-4,dp.y);g.moveTo(dp.x+4,dp.y);g.lineTo(dp.x+11,dp.y);
  g.moveTo(dp.x,dp.y-11);g.lineTo(dp.x,dp.y-4);g.moveTo(dp.x,dp.y+4);g.lineTo(dp.x,dp.y+11);
  g.stroke();g.restore()}

let anim={frames:[],cur:0,fps:12,playing:false,onion:true,onionN:1,onionOp:.28,timer:null,onionCanvas:null};

function resetAnim(){animStop();anim.frames=[];anim.cur=0;anim.onionCanvas=null;if(framesEl)uiFrames()}

function vShapesJSON(L){return JSON.stringify(L.shapes,(k,v)=>k[0]==='_'?undefined:v)}
function captureFrame(){
  return{cells:allLayersFlat().filter(l=>l.type!=='group').map(L=>L.type==='raster'
    ?{id:L.id,kind:'r',canvas:L.canvas,offset:{x:L.offset.x,y:L.offset.y}}
    :{id:L.id,kind:'v',shapes:vShapesJSON(L)})}}
function deepFrame(f){
  return{cells:f.cells.map(c=>c.kind==='r'
    ?{id:c.id,kind:'r',canvas:cloneCanvas(c.canvas),offset:{x:c.offset.x,y:c.offset.y}}
    :{id:c.id,kind:'v',shapes:c.shapes})}}
function blankFrame(){
  return{cells:allLayersFlat().filter(l=>l.type!=='group').map(L=>L.type==='raster'
    ?{id:L.id,kind:'r',canvas:mkCanvas(doc.w,doc.h),offset:{x:0,y:0}}
    :{id:L.id,kind:'v',shapes:vShapesJSON(L)})}}
function applyFrame(f){
  for(const cell of f.cells){
    const L=findLayer(cell.id);if(!L||L.type==='group')continue;
    if(cell.kind==='r'){
      if(cell.canvas.width!==doc.w||cell.canvas.height!==doc.h){
        const c=mkCanvas(doc.w,doc.h);
        c.getContext('2d').drawImage(cell.canvas,0,0,cell.canvas.width,cell.canvas.height,0,0,doc.w,doc.h);
        cell.canvas=c}

    else{L.shapes=JSON.parse(cell.shapes);for(const s of L.shapes)s._dirty=true}}

function animGoTo(i,silent){
  if(!anim.frames.length)return;

  anim.frames[anim.cur]=captureFrame();

function animAddFrame(dup){

function animDelFrame(){

function buildOnion(){

function drawFrameThumb(tc,f){

function exportWebM(){

  rec.onstop=()=>{download(safeName(doc.name)+'-anim.webm',new Blob(chunks,{type:'video/webm'}));

  const step=()=>{
    if(i>=rendered.length){setTimeout(()=>{try{rec.stop()}catch(e){}},250);return}
    g.clearRect(0,0,doc.w,doc.h);

/* ============================================================
   PSD LAYERED IMPORT — layer records + RLE/Zip channels
   ============================================================ */
async function inflateZlib(bytes){
  const ds=new DecompressionStream('deflate');
  const st=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(st).arrayBuffer())}
function psdBlend(k){
  return{'norm':'source-over','mul ':'multiply','scrn':'screen','over':'overlay','dark':'darken','lite':'lighten',
    'diff':'difference','excl':'exclusion','hue ':'hue','sat ':'saturation','colr':'color','lum ':'luminosity',
    'hLit':'hard-light','sLit':'soft-light','lddg':'linear-dodge','dkCl':'color-burn','adDr':'color-dodge'}[k]||'source-over'}
async function decodePSDLayers(buf){
  const dv=new DataView(buf);const u8=new Uint8Array(buf);
  if(String.fromCharCode(u8[0],u8[1],u8[2],u8[3])!=='8BPS')throw new Error('PSD signature nahi mila');
  const ver=dv.getUint16(4);if(ver!==1)throw new Error('PSB unsupported');
  const H=dv.getUint32(14),W=dv.getUint32(18);
  const depth=dv.getUint16(22),mode=dv.getUint16(24);
  if(depth!==8)throw new Error('sirf 8-bit PSD');
  let o=26;
  o+=4+dv.getUint32(o);
  o+=4+dv.getUint32(o);
  const lmiLen=dv.getUint32(o);
  let p=o+4;
  const out=[];
  if(lmiLen>=6){
    const liLen=dv.getUint32(p);p+=4;
    if(liLen>=2){
      let count=dv.getInt16(p);p+=2;
      const n=Math.abs(count);
      const recs=[];
      for(let i=0;i<n&&p+16<=u8.length;i++){
        const top=dv.getInt32(p),left=dv.getInt32(p+4),bottom=dv.getInt32(p+8),right=dv.getInt32(p+12);p+=16;
        const nCh=dv.getUint16(p);p+=2;
        const chs=[];
        for(let c=0;c<nCh;c++){chs.push({id:dv.getInt16(p),len:dv.getUint32(p+2)});p+=6}
        p+=4; // '8BIM'
        const blend=String.fromCharCode(u8[p],u8[p+1],u8[p+2],u8[p+3]);p+=4;
        const opacity=u8[p];const flags=u8[p+2];p+=4;
        const extraLen=dv.getUint32(p);const extraEnd=p+4+extraLen;p+=4;
        if(p+4<=u8.length){
          const maskLen=dv.getUint32(p);p+=4+maskLen;
          if(p+4<=u8.length){const brLen=dv.getUint32(p);p+=4+brLen}
          else p=extraEnd}
        let name='Layer '+(i+1);
        if(p<u8.length){
          const nl=u8[p];
          if(nl>0&&p+1+nl<=u8.length){
            let s='';
            for(let k=0;k<nl;k++)s+=String.fromCharCode(u8[p+1+k]);
            if(!/^<|[.]$/.test(s))name=s}}
        p=Math.min(extraEnd,u8.length);
        recs.push({top,left,bottom,right,chs,blend,opacity,flags,name})}
      for(const r of recs){
        try{
          if(r.blend==='pass'||/^<\/|^\./.test(r.name)||r.name==='')continue;
          const w=r.right-r.left,h=r.bottom-r.top;
          if(w<=0||h<=0||w*h>40e6){continue}
          const planes={};
          for(const ch of r.chs){
            const fieldStart=p;
            const comp=dv.getUint16(fieldStart);
            const dataEnd=fieldStart+ch.len;
            p=dataEnd;
            if(ch.id<-1)continue;
            if(comp===0){
              if(fieldStart+2+w*h<=u8.length)planes[ch.id]=u8.slice(fieldStart+2,fieldStart+2+w*h)}
            else if(comp===1){
              const plane=new Uint8Array(w*h);
              let rp=fieldStart+2+h*2;
              let ok=true;
              for(let row=0;row<h;row++){
                const len=dv.getUint16(fieldStart+2+row*2);
                if(rp+len>u8.length){ok=false;break}
                unpack(u8,rp,plane,row*w,w);
                rp+=len}
              if(ok)planes[ch.id]=plane}
            else if(comp===2&&typeof DecompressionStream!=='undefined'){
              try{
                const raw=u8.slice(fieldStart+2,dataEnd);
                const infl=await inflateZlib(raw);

            const outC=mkCanvas(w,h);
            const ig=outC.getContext('2d');

            const isGray=mode===1;
            for(let i=0;i<w*h;i++){
              let R,Gc,B,A;
              if(isGray){
                const gval=planes[0]?planes[0][i]:255;

                R=planes[0]?planes[0][i]:0;

            ig.putImageData(img,0,0);

async function placePSD(buf,name){

    uiLayers();uiProps();docDirty=true;needRender=true;

  else{

/* ---------- Layer FX (non-destructive, render-time) ---------- */
function ensureFx(L){
  if(!L.fx)L.fx={shadow:{on:false,color:'#000000',blur:12,ox:6,oy:6,op:60},
    glow:{on:false,color:'#5b8cff',blur:18},
    outline:{on:false,color:'#ffffff',width:3}};
  return L.fx}
function fxAnyOn(L){const fx=L.fx;if(!fx)return false;
  return !!(fx.shadow&&fx.shadow.on||fx.glow&&fx.glow.on||fx.outline&&fx.outline.on)}
function silhouette(src,color){
  const c=cloneCanvas(src);const g=c.getContext('2d');
  g.globalCompositeOperation='source-in';g.fillStyle=color;
  g.fillRect(0,0,c.width,c.height);return c}
function drawLayerFxOrPlain(g,L){
  if(L.type==='group'){drawGroupLayer(g,L);return}
  if(!fxAnyOn(L)){drawLayerTo(g,L);return}
  CUR_LAYER=L;
  const fx=ensureFx(L);
  const tmp=mkCanvas(doc.w,doc.h);const tg=tmp.getContext('2d');
  if(L.type==='raster'){
    if(L.mask&&L.mask.enabled){const sc=maskScratch();const sg=sc.getContext('2d');
      sg.clearRect(0,0,doc.w,doc.h);sg.drawImage(L.canvas,L.offset.x,L.offset.y);
      sg.globalCompositeOperation='destination-in';sg.drawImage(L.mask.canvas,0,0);sg.globalCompositeOperation='source-over';
      tg.drawImage(sc,0,0)}
    else tg.drawImage(L.canvas,L.offset.x,L.offset.y)}
  else for(const s of L.shapes)drawShape(tg,s);
  g.save();g.globalAlpha=L.opacity;
  g.globalCompositeOperation=L.blend==='source-over'?'source-over':L.blend;
  if(fx.outline.on){const sil=silhouette(tmp,fx.outline.color);
    const r=Math.max(1,fx.outline.width);const steps=14;
    for(let i=0;i<steps;i++){const a=i/steps*TAU;
      g.drawImage(sil,Math.cos(a)*r,Math.sin(a)*r)}}
  const S=10000;
  if(fx.shadow.on){g.save();
    g.globalAlpha=L.opacity*(fx.shadow.op==null?.6:fx.shadow.op/100);
    g.shadowColor=fx.shadow.color;g.shadowBlur=fx.shadow.blur;
    g.shadowOffsetX=(fx.shadow.ox||0)+S;g.shadowOffsetY=fx.shadow.oy||0;
    g.drawImage(tmp,-S,0);g.restore()}
  if(fx.glow.on){g.save();g.globalAlpha=L.opacity;
    g.shadowColor=fx.glow.color;g.shadowBlur=fx.glow.blur;
    g.shadowOffsetX=S;g.shadowOffsetY=0;
    g.drawImage(tmp,-S,0);g.drawImage(tmp,-S,0);g.drawImage(tmp,-S,0);
    g.restore()}
  g.drawImage(tmp,0,0);g.restore();CUR_LAYER=null}

/* ---------- Align & Distribute (vector shapes) ---------- */
function alignShapes(mode){
  if(!selShapes.length){toast('Pehle shapes select karo');return}
  pushUndo();
  const bbs=selShapes.map(s=>({s,b:shapeBBoxDoc(s)}));
  let tx;
  if(selShapes.length===1)tx={x:0,y:0,x2:doc.w,y2:doc.h};
  else{let x=1e9,y=1e9,x2=-1e9,y2=-1e9;
    for(const{b}of bbs){x=Math.min(x,b.x);y=Math.min(y,b.y);x2=Math.max(x2,b.x2);y2=Math.max(y2,b.y2)}
    tx={x,y,x2,y2}}
  for(const{s,b}of bbs){
    let dx=0,dy=0;
    if(mode==='left')dx=tx.x-b.x;
    else if(mode==='right')dx=tx.x2-b.x2;
    else if(mode==='cx')dx=(tx.x+tx.x2)/2-(b.x+b.x2)/2;
    else if(mode==='top')dy=tx.y-b.y;
    else if(mode==='bottom')dy=tx.y2-b.y2;
    else if(mode==='cy')dy=(tx.y+tx.y2)/2-(b.y+b.y2)/2;
    if(dx||dy){const t=s.t||M.id();
      s.t=[t[0],t[1],t[2],t[3],t[4]+dx,t[5]+dy];s._dirty=true}}
  docDirty=true;needRender=true}
function distributeShapes(axis){
  if(selShapes.length<3){toast('Distribute ke liye 3+ shapes select karo');return}
  pushUndo();
  const items=selShapes.map(s=>({s,b:shapeBBoxDoc(s)}));
  const key=axis==='h'?'x':'y';
  items.sort((a,b)=>a.b[key]-b.b[key]);
  const first=items[0].b,last=items[items.length-1].b;
  const span=(axis==='h'?last.x2-first.x:last.y2-first.y);
  const totalSize=items.reduce((a,it)=>a+(axis==='h'?it.b.x2-it.b.x:it.b.y2-it.b.y),0);
  const gap=(span-totalSize)/(items.length-1);
  let cur=axis==='h'?first.x:first.y;
  for(const it of items){
    const size=axis==='h'?it.b.x2-it.b.x:it.b.y2-it.b.y;
    const delta=cur-it.b[key];
    const t=it.s.t||M.id();
    if(axis==='h')it.s.t=[t[0],t[1],t[2],t[3],t[4]+delta,t[5]];
    else it.s.t=[t[0],t[1],t[2],t[3],t[4],t[5]+delta];
    it.s._dirty=true;cur+=size+gap}
  docDirty=true;needRender=true}

/* ---------- Shape z-order ---------- */
function shapeZOrder(dir){
  const L=activeLayer();
  if(!L||L.type!=='vector'){toast('Vector layer par shapes select karo');return}
  if(!selShapes.length){toast('Shapes select karo');return}
  pushUndo();
  const arr=L.shapes.slice();
  const picked=arr.filter(s=>selShapes.includes(s));
  if(dir==='front'){L.shapes=arr.filter(s=>!selShapes.includes(s)).concat(picked)}
  else if(dir==='back'){L.shapes=picked.concat(arr.filter(s=>!selShapes.includes(s)))}
  else if(dir==='fwd'){
    const idxs=arr.map((s,i)=>selShapes.includes(s)?i:-1).filter(i=>i>=0).sort((a,b)=>b-a);
    L.shapes=arr.slice();
    for(const i of idxs){if(i<L.shapes.length-1){const[x]=L.shapes.splice(i,1);L.shapes.splice(i+1,0,x)}}}
  else{
    const idxs=arr.map((s,i)=>selShapes.includes(s)?i:-1).filter(i=>i>=0).sort((a,b)=>a-b);
    L.shapes=arr.slice();
    for(const i of idxs){if(i>0){const[x]=L.shapes.splice(i,1);L.shapes.splice(i-1,0,x)}}}
  docDirty=true;needRender=true;uiLayersRefresh()}

/* ---------- Text on Path ---------- */
function pathPointAt(ring,cum,total,d){
  d=((d%total)+total)%total;
  let lo=0,hi=cum.length-1;
  while(lo<hi){const mid=(lo+hi)>>1;if(cum[mid]<d)lo=mid+1;else hi=mid}
  const i=Math.max(1,lo);
  const t=(d-cum[i-1])/((cum[i]-cum[i-1])||1);
  return{x:lerp(ring[i-1].x,ring[i].x,t),y:lerp(ring[i-1].y,ring[i].y,t),
    ang:Math.atan2(ring[i].y-ring[i-1].y,ring[i].x-ring[i-1].x)}}
function drawTextOnPath(g,s,pathShape){
  const line=s.text.split('\n')[0];
  if(!line)return;
  const rings=flatRings(pathShape);
  if(!rings.length||rings[0].length<2)return;
  const ring=rings[0];
  const cum=[0];let total=0;
  for(let i=1;i<ring.length;i++){total+=Math.hypot(ring[i].x-ring[i-1].x,ring[i].y-ring[i-1].y);cum.push(total)}
  if(total<10)return;
  g.save();g.font=fontOf(s);g.textBaseline='alphabetic';g.textAlign='left';
  let d=s.onPath.offset||0;
  for(const ch of line){
    const w=g.measureText(ch).width;
    const adv=w+(s.ls||0);
    d+=adv/2;
    const pt=pathPointAt(ring,cum,total,d);
    if(pt){g.save();g.translate(pt.x,pt.y);g.rotate(pt.ang);
      if(s.fill)g.fillText(ch,0,0);
      if(s.stroke&&s.stroke.width>0){g.lineWidth=s.stroke.width;g.strokeStyle=s.stroke.color;
        g.lineJoin='round';g.strokeText(ch,0,0)}
      g.restore()}
    d+=adv/2}
  g.restore()}

/* ---------- HSV color picker ---------- */
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;

function hsv2rgb(h,s,v){h=((h%360)+360)%360;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}
  else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}

function textLineW(g,line,s){let w=g.measureText(line).width;

/* ---------- rounded rect ---------- */
function rrPath(p,s){
  const x=Math.min(s.x,s.x+s.w),y=Math.min(s.y,s.y+s.h),w=Math.abs(s.w),h=Math.abs(s.h);
  const r=clamp(s.r||0,0,Math.min(w,h)/2);
  if(r<=0){p.rect(x,y,w,h);return}
  p.moveTo(x+r,y);p.lineTo(x+w-r,y);p.arc(x+w-r,y+r,r,-Math.PI/2,0);
  p.lineTo(x+w,y+h-r);p.arc(x+w-r,y+h-r,r,0,Math.PI/2);
  p.lineTo(x+r,y+h);p.arc(x+r,y+h-r,r,Math.PI/2,Math.PI);
  p.lineTo(x,y+r);p.arc(x+r,y+r,r,Math.PI,Math.PI*1.5);p.closePath()}

    if(ax==='x'&&!bx&&Math.abs(t-p.x)<tol){x=t;bx=true}
    if(ax==='y'&&!by&&Math.abs(t-p.y)<tol){y=t;by=true}}
  return{x,y}}
function collectSnapTargets(exclude){
  const tx=[],ty=[];
  if(!opts.snapOn)return{tx,ty};
  tx.push(0,doc.w,doc.w/2);ty.push(0,doc.h,doc.h/2);
  for(const gd of doc.guides||[]){gd.axis==='v'?tx.push(gd.pos):ty.push(gd.pos)}
  for(const L of allLayersFlat()){
    if(L.type!=='vector')continue;
    for(const s of L.shapes){if(exclude&&exclude.includes(s))continue;
      const b=shapeBBoxDoc(s);tx.push(b.x,b.x2,(b.x+b.x2)/2);ty.push(b.y,b.y2,(b.y+b.y2)/2)}}
  return{tx,ty}}
function snapAxes(ptsX,ptsY,targets){
  const lines=[];let dx=0,dy=0;
  if(opts.snapOn){
    const tol=6/zoom;let bx=null,by=null;
    for(const px of ptsX)for(const t of targets.tx){const d=t-px;if(Math.abs(d)<tol&&(!bx||Math.abs(d)<Math.abs(bx.d)))bx={d,pos:t}}
    for(const py of ptsY)for(const t of targets.ty){const d=t-py;if(Math.abs(d)<tol&&(!by||Math.abs(d)<Math.abs(by.d)))by={d,pos:t}}
    if(bx){dx+=bx.d;lines.push({axis:'v',pos:bx.pos})}
    if(by){dy+=by.d;lines.push({axis:'h',pos:by.pos})}}
  else if(opts.gridOn&&opts.gridSnap&&ptsX.length){
    dx+=Math.round((ptsX[0]+dx)/opts.gridSize)*opts.gridSize-ptsX[0];
    dy+=Math.round((ptsY[0]+dy)/opts.gridSize)*opts.gridSize-ptsY[0]}
  return{dx,dy,lines}}
function guideHit(p){
  if(!doc.guides||!doc.guides.length)return null;
  const tol=5/zoom;
  for(let i=doc.guides.length-1;i>=0;i--){const gd=doc.guides[i];
    if(gd.axis==='v'&&Math.abs(gd.pos-p.x)*zoom<5)return i;
    if(gd.axis==='h'&&Math.abs(gd.pos-p.y)*zoom<5)return i}
  return null}

/* ---------- symmetry ---------- */
function symCloneShapes(s){
  const mk=src=>{const c=JSON.parse(JSON.stringify(src,(k,v)=>k[0]==='_'?undefined:v));
    c.id=uid();c._dirty=true;return c};
  const out=[s];
  if(!opts.sym.on)return out;
  const n=clamp(opts.sym.n,2,16),cx=doc.w/2,cy=doc.h/2;
  for(let i=1;i<n;i++){const c=mk(s);c.t=M.mul(M.tRotAbout(cx,cy,TAU*i/n),s.t||M.id());out.push(c)}
  if(opts.sym.mirror){
    const F=M.mul(M.translate(doc.w,0),M.scale(-1,1));
    const cur=out.slice();
    for(const b of cur){const c=mk(b);c.t=M.mul(F,b.t||M.id());out.push(c)}}
  return out}
function symRasterCombine(tmp){
  if(!opts.sym.on)return tmp;
  const n=clamp(opts.sym.n,2,16),cx=doc.w/2,cy=doc.h/2;
  const comb=mkCanvas(doc.w,doc.h);const g=comb.getContext('2d');
  g.drawImage(tmp,0,0);
  for(let i=1;i<n;i++){g.save();g.translate(cx,cy);g.rotate(TAU*i/n);g.translate(-cx,-cy);g.drawImage(tmp,0,0);g.restore()}
  if(opts.sym.mirror){g.save();g.translate(doc.w,0);g.scale(-1,1);g.drawImage(comb,0,0);g.restore()}
  return comb}

/* ---------- shapes library ---------- */
function libShape(name,cx,cy,size){
  const P=[];const push=(x,y)=>P.push({p:{x:cx+x,y:cy+y},in:null,out:null});
  const S=size;
  if(name==='arrow'){
    const w=S,h=S*0.62,sh=h*0.42,hw=w*0.62;
    [[-hw,-sh/2],[hw/2-w/2,-sh/2],[hw/2-w/2,-h/2],[w/2,0],[hw/2-w/2,h/2],[hw/2-w/2,sh/2],[-hw,sh/2],[-hw,-sh/2]].forEach(pt=>push(pt[0],pt[1]))}
  else if(name==='heart'){
    for(let i=0;i<=48;i++){const t=i/48*TAU;
      const x=16*Math.pow(Math.sin(t),3);
      const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      push(x*S/34,y*S/34)}}
  else if(name==='bubble'){
    const w=S,h=S*0.7,r=S*0.14;
    const pts=[];const cor=8;
    const corner=(cx2,cy2,a0)=>{for(let i=0;i<=cor;i++){const a=a0+i/cor*(Math.PI/2);pts.push([cx2+Math.cos(a)*r,cy2+Math.sin(a)*r])}};
    corner(-w/2+r,-h/2+r,Math.PI);corner(w/2-r,-h/2+r,-Math.PI/2);corner(w/2-r,h/2-r,0);
    pts.push([0,h/2]);pts.push([-w*0.2,h/2+r*0.9]);
    corner(-w/2+r,h/2-r,Math.PI/2);
    pts.forEach(pt=>push(pt[0],pt[1]))}
  else if(name==='badge'){
    const n=14;
    for(let i=0;i<=n*2;i++){const a=i/(n*2)*TAU;
      const r=S/2*(1+(i%2?0.09:-0.02));
      push(Math.cos(a)*r,Math.sin(a)*r)}}
  else if(name==='diamond'){
    [[0,-S/2],[S/2,0],[0,S/2],[-S/2,0],[0,-S/2]].forEach(pt=>push(pt[0],pt[1]))}
  else if(name==='cross'){
    const a=S*0.16,b=S/2;
    [[-a,-b],[a,-b],[a,-a],[b,-a],[b,a],[a,a],[a,b],[-a,b],[-a,a],[-b,a],[-b,-a],[-a,-a],[-a,-b]].forEach(pt=>push(pt[0],pt[1]))}
  else if(name==='bolt'){
    [[S*0.1,-S/2],[-S*0.3,S*0.08],[-S*0.02,S*0.08],[-S*0.12,S/2],[S*0.3,-S*0.06],[S*0.02,-S*0.06],[S*0.1,-S/2]].forEach(pt=>push(pt[0],pt[1]))}
  else return null;
  return[{nodes:P,closed:true}]}
function insertLibShape(name){
  if(!doc)return;
  pushUndo();
  const L=ensureVectorLayer();
  const size=Math.min(doc.w,doc.h)*0.5;
  const c=docToScreen({x:doc.w/2,y:doc.h/2});
  const sub=libShape(name,doc.w/2,doc.h/2,size);

  const s={id:uid(),type:'path',subpaths:sub,evenodd:false,

function stepRepeat(n,dx,dy,rot,sc){
  pushUndo();
  const L=activeLayer();
  const clones=[];
  for(const s of selShapes){
    const b=shapeBBoxDoc(s);
    const c0={x:(b.x+b.x2)/2,y:(b.y+b.y2)/2};

      const c=JSON.parse(JSON.stringify(s,(k,v)=>k[0]==='_'?undefined:v));
      c.id=uid();c._dirty=true;
      const cc={x:c0.x+dx*i,y:c0.y+dy*i};
      let m=M.translate(dx*i,dy*i);

      if(sc!==1)m=M.mul(M.tScaleAbout(cc.x,cc.y,Math.pow(sc,i),Math.pow(sc,i)),m);
      c.t=M.mul(m,s.t||M.id());

/* ---------- layer groups core ---------- */
function allLayersFlat(){
  const out=[];
  (function walk(arr){for(const L of arr){out.push(L);if(L.type==='group'&&L.children)walk(L.children)}})(doc?doc.layers:[]);
  return out}
function findLayer(id){
  let f=null;
  (function walk(arr){for(const L of arr){if(L.id===id){f=L;return}if(L.type==='group'&&L.children)walk(L.children)}})(doc?doc.layers:[]);
  return f}
function parentArrayOf(id){
  let found=null;
  (function walk(arr){if(arr.some(l=>l.id===id))found=arr;
    else for(const l of arr)if(l.type==='group'&&l.children)walk(l.children)})(doc?doc.layers:[]);
  return found}
function serializeLayer(L){
  const m={id:L.id,type:L.type,name:L.name,visible:L.visible,locked:L.locked,opacity:L.opacity,blend:L.blend,fx:L.fx?JSON.parse(JSON.stringify(L.fx)):null};
  if(L.clip)m.clip=true;
  if(L.type==='group'){m.expanded=L.expanded!==false;m.children=L.children.map(serializeLayer);return{m,data:null}}
  let data;
  if(L.type==='raster'){
    const c=snapCache[L.id];
    let cv,off;
    if(c&&c.ver===L.ver){cv=c.clone;off={x:L.offset.x,y:L.offset.y}}
    else{cv=cloneCanvas(L.canvas);off={x:L.offset.x,y:L.offset.y};
      snapCache[L.id]={ver:L.ver,clone:cv}}
    const mask=L.mask?{enabled:!!L.mask.enabled,canvas:cloneCanvas(L.mask.canvas)}:null;
    data={canvas:cv,offset:off,shared:true,mask}}
  else data=cloneLayerData(L);
  return{m,data}}
function deserializeLayer(e){
  const m=e.m;
  if(m.type==='group')return{...m,fx:m.fx?JSON.parse(JSON.stringify(m.fx)):null,
    children:(m.children||[]).map(deserializeLayer),expanded:m.expanded!==false,thumbDirty:true};
  let base;
  if(m.type==='raster'){base={...m,canvas:cloneCanvas(e.data.canvas),offset:{x:e.data.offset.x,y:e.data.offset.y},ver:0,shapes:null,thumbDirty:true};
    base.mask=e.data.mask?{enabled:!!e.data.mask.enabled,canvas:cloneCanvas(e.data.mask.canvas)}:null}
  else base={...m,shapes:JSON.parse(e.data.shapes),canvas:null,offset:null,thumbDirty:true};
  base.fx=m.fx?JSON.parse(JSON.stringify(m.fx)):null;
  return base}

function deepCloneLayer(L){

function flattenLayerToRaster(L,name){

/* ---------- mask blur (feather) ---------- */
function blurMask(m,W,H,r){
  if(r<=0)return m;
  const a=new Float32Array(W*H);
  for(let i=0;i<m.length;i++)a[i]=m[i]/255;
  const b=new Float32Array(W*H);
  const w2=r*2+1;
  for(let y=0;y<H;y++){const row=y*W;let sum=0;
    for(let x=-r;x<=r;x++)sum+=a[row+clamp(x,0,W-1)];
    for(let x=0;x<W;x++){b[row+x]=sum/w2;
      sum+=a[row+clamp(x+r+1,0,W-1)]-a[row+clamp(x-r,0,W-1)]}}
  const out=new Float32Array(W*H);
  for(let x=0;x<W;x++){let sum=0;
    for(let y=-r;y<=r;y++)sum+=b[clamp(y,0,H-1)*W+x];
    for(let y=0;y<H;y++){out[y*W+x]=sum/w2;
      sum+=b[clamp(y+r+1,0,H-1)*W+x]-b[clamp(y-r,0,H-1)*W+x]}}
  const res=new Uint8Array(W*H);
  for(let i=0;i<res.length;i++)res[i]=Math.round(clamp(out[i],0,1)*255);
  return res}
function removeByMask(L,mask,feather){
  const g=L.canvas.getContext('2d');
  const img=g.getImageData(0,0,doc.w,doc.h);
  const norm=new Uint8Array(mask.length);
  for(let i=0;i<mask.length;i++)norm[i]=mask[i]?255:0;
  const soft=blurMask(norm,doc.w,doc.h,Math.max(0,feather|0));
  for(let i=0;i<soft.length;i++){
    const k=soft[i]/255;
    if(k>0)img.data[i*4+3]=img.data[i*4+3]*(1-k)}
  g.putImageData(img,0,0);
  layerVerBump(L);docDirty=true;needRender=true;uiLayersRefresh()}

/* ---------- background erase core ---------- */
function bgMaskAt(L,p,tol){
  bakeOffset(L);
  const x0=Math.floor(p.x-L.offset.x),y0=Math.floor(p.y-L.offset.y);
  if(x0<0||y0<0||x0>=doc.w||y0>=doc.h)return null;
  const px=L.canvas.getContext('2d').getImageData(0,0,doc.w,doc.h).data;
  const si=(y0*doc.w+x0)*4;
  if(px[si+3]<8){toast('Wahan koi color nahi (transparent)');return null}
  const tol2=tol*tol*3*1.44;
  const R=px[si],Gg=px[si+1],B=px[si+2];
  const match=i=>{const dr=px[i]-R,dg=px[i+1]-Gg,db=px[i+2]-B;
    return dr*dr+dg*dg+db*db<=tol2&&px[i+3]>=8};
  let mask;
  if(opts.bgGlobal){
    mask=new Uint8Array(doc.w*doc.h);
    for(let i=0;i<mask.length;i++)if(match(i*4))mask[i]=255}
  else mask=floodScan(px,doc.w,doc.h,x0,y0,match);
  if(pixSel)for(let i=0;i<mask.length;i++)if(!pixSel.mask[i])mask[i]=0;
  return mask}
function bgRemoveAt(L,p){
  const mask=bgMaskAt(L,p,opts.bgTol);
  if(!mask)return;
  removeByMask(L,mask,opts.bgFeather)}
function bgRemoveAuto(){
  const L=activeRasterForFilter(true);if(!L)return;
  bakeOffset(L);
  pushUndo();
  const px=L.canvas.getContext('2d').getImageData(0,0,doc.w,doc.h).data;
  const W=doc.w,H=doc.h;
  const cornerAvg=(cx,cy)=>{
    let r=0,gg=0,b=0,a=0,n=0;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const x=clamp(cx+dx,0,W-1),y=clamp(cy+dy,0,H-1);
      const i=(y*W+x)*4;r+=px[i];gg+=px[i+1];b+=px[i+2];a+=px[i+3];n++}
    return{r:r/n,g:gg/n,b:b/n,a:a/n}};
  const corners=[cornerAvg(3,3),cornerAvg(W-4,3),cornerAvg(3,H-4),cornerAvg(W-4,H-4)];
  const refs=[];
  const tol2=opts.bgTol*opts.bgTol*3*1.44;
  for(const c of corners){
    if(c.a<20)continue;
    if(refs.some(r2=>(r2.r-c.r)**2+(r2.g-c.g)**2+(r2.b-c.b)**2<tol2/4))continue;
    refs.push(c)}
  if(!refs.length){undoStack.pop();uiQuick();toast('Corners pehle se transparent hain!');return}
  const mask=new Uint8Array(W*H);
  let cnt=0;
  for(let i=0;i<W*H;i++){
    const j=i*4;
    if(px[j+3]<8)continue;
    for(const rf of refs){
      const dr=px[j]-rf.r,dg=px[j+1]-rf.g,db=px[j+2]-rf.b;
      if(dr*dr+dg*dg+db*db<=tol2){mask[i]=255;cnt++;break}}}
  if(!cnt){undoStack.pop();uiQuick();toast('Background detect nahi hua — Background Eraser (D) se click karke try karo','ok',3200);return}
  if(pixSel)for(let i=0;i<mask.length;i++)if(!pixSel.mask[i])mask[i]=0;
  removeByMask(L,mask,opts.bgFeather);
  toast('Background removed ('+(cnt/1000).toFixed(0)+'k px · '+refs.length+' corner color) — PNG me transparent export hoga','ok',3400)}

/* ---------- background eraser tool ---------- */

/* ---------- color trace (multi-color vector) ---------- */
function buildPalette(px,W,H,step,maxC){
  const counts=new Map();
  for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){
    const i=(y*W+x)*4;
    if(px[i+3]<128)continue;
    const key=((px[i]>>4)<<8)|((px[i+1]>>4)<<4)|(px[i+2]>>4);
    let e=counts.get(key);
    if(!e){e={n:0,r:0,g:0,b:0};counts.set(key,e)}
    e.n++;e.r+=px[i];e.g+=px[i+1];e.b+=px[i+2]}
  return[...counts.values()].sort((a,b)=>b.n-a.n).slice(0,maxC)
    .map(e=>({r:Math.round(e.r/e.n),g:Math.round(e.g/e.n),b:Math.round(e.b/e.n)}))}
function traceColor(L,o){
  bakeOffset(L);
  const step=Math.max(1,o.detail|0);
  const W=Math.floor(doc.w/step),H=Math.floor(doc.h/step);
  const src=L.canvas.getContext('2d').getImageData(0,0,doc.w,doc.h).data;
  const pal=buildPalette(src,doc.w,doc.h,step,clamp(o.colors|0,2,16));
  if(!pal.length){toast('Trace ke liye opaque pixels nahi mile','err');return}
  pal.sort((a,b)=>(b.r*.3+b.g*.6+b.b*.1)-(a.r*.3+a.g*.6+a.b*.1));
  const map=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=((y*step)*doc.w+x*step)*4;
    if(src[i+3]<128){map[y*W+x]=255;continue}
    let bi=0,bd=1e9;
    for(let p2=0;p2<pal.length;p2++){
      const dr=src[i]-pal[p2].r,dg=src[i+1]-pal[p2].g,db=src[i+2]-pal[p2].b;
      const d=dr*dr+dg*dg+db*db;
      if(d<bd){bd=d;bi=p2}}
    map[y*W+x]=bi}
  pushUndo();
  const V=ensureVectorLayer();
  const shapes=[];
  for(let pi=0;pi<pal.length;pi++){
    const mask=new Uint8Array(W*H);
    for(let i=0;i<map.length;i++)if(map[i]===pi)mask[i]=255;
    const loops=traceMaskLoops(mask,W,H);
    const subs=[];
    for(const loop of loops){
      const simp=rdp(loop,Math.max(0.4,o.simp/step));
      if(simp.length<3)continue;
      let area=0;
      for(let i=0;i<simp.length;i++){const q=simp[(i+1)%simp.length];area+=simp[i].x*q.y-q.x*simp[i].y}
      area=Math.abs(area)/2;
      if(area*step*step<(o.minArea||0))continue;
      let nodes;
      if(o.smooth)nodes=catmullNodes(simp,true)||simp.map(p2=>({p:{x:p2.x*step,y:p2.y*step},in:null,out:null}));
      else nodes=simp.map(p2=>({p:{x:p2.x*step,y:p2.y*step},in:null,out:null}));
      subs.push({nodes,closed:true})}
    if(!subs.length)continue;
    shapes.push({id:uid(),type:'path',subpaths:subs,evenodd:true,
      fill:{type:'solid',color:rgbToHex(pal[pi].r,pal[pi].g,pal[pi].b)},stroke:null,t:null,_dirty:true})}
  if(!shapes.length){undoStack.pop();uiQuick();toast('Trace me kuch nahi mila — Colors/Detail adjust karo','err');return}
  for(const s of shapes)V.shapes.push(s);
  selShapes=[];
  docDirty=true;needRender=true;uiProps();uiLayersRefresh();
  const nP=shapes.reduce((a,s)=>a+s.subpaths.length,0);
  toast('Color trace: '+shapes.length+' colors → '+nP+' vector shapes (Node tool A se edit karo)','ok',3600)}

/* ---------- rotate canvas 90° ---------- */
function rotateDoc(cw){
  commitFloat();
  pushUndo();
  const W=doc.w,H=doc.h;
  const T=cw?[0,1,-1,0,H,0]:[0,-1,1,0,0,W];
  for(const L of allLayersFlat()){
    if(L.type==='raster'){
      const tmp=mkCanvas(W,H);
      tmp.getContext('2d').drawImage(L.canvas,L.offset.x,L.offset.y);
      const c=mkCanvas(H,W);
      const g=c.getContext('2d');
      g.translate(cw?H:0,cw?0:W);
      g.rotate(cw?Math.PI/2:-Math.PI/2);
      g.drawImage(tmp,0,0);
      L.canvas=c;L.offset={x:0,y:0};layerVerBump(L)}
    else if(L.type==='vector'){
      for(const s of L.shapes){s.t=M.mul(T,s.t||M.id());s._dirty=true}}}
  doc.w=H;doc.h=W;
  comp=mkCanvas(doc.w,doc.h);
  doc.guides=(doc.guides||[]).map(g=>cw
    ?(g.axis==='h'?{axis:'v',pos:H-g.pos}:{axis:'h',pos:g.pos})
    :(g.axis==='h'?{axis:'v',pos:g.pos}:{axis:'h',pos:W-g.pos}));
  clearSel();clearPixSel();resetAnim();
  docDirty=true;fitView();needRender=true;uiLayersRefresh();
  toast('Canvas '+(cw?'90° CW':'90° CCW')+' rotated','ok')}

/* ---------- Curves (master RGB curve, draggable) ---------- */
function lutFromPoints(pts){
  pts=pts.slice().sort((a,b)=>a[0]-b[0]);
  const lut=new Uint8Array(256);
  for(let i=0;i<256;i++){
    if(i<=pts[0][0]){lut[i]=clamp(pts[0][1],0,255);continue}
    if(i>=pts[pts.length-1][0]){lut[i]=clamp(pts[pts.length-1][1],0,255);continue}
    for(let k=1;k<pts.length;k++){
      if(i<=pts[k][0]){
        const t=(i-pts[k-1][0])/((pts[k][0]-pts[k-1][0])||1);
        lut[i]=clamp(Math.round(lerp(pts[k-1][1],pts[k][1],t)),0,255);break}}}
  return lut}
function applyCurveLUT(d,lut){
  for(let i=0;i<d.length;i+=4){
    d[i]=lut[d[i]];d[i+1]=lut[d[i+1]];d[i+2]=lut[d[i+2]]}}

/* ---------- GIF export (GIF89a + LZW) ---------- */
function rgbSample(data,w,h,maxSamples){
  const out=[];const total=w*h;
  const step=Math.max(1,Math.floor(total/maxSamples));
  for(let i=0;i<total;i+=step){
    const j=i*4;
    if(data[j+3]<128)continue;
    out.push([data[j],data[j+1],data[j+2]])}
  return out}
function medianCut(samples,maxColors){
  if(!samples.length)return[[0,0,0]];
  let boxes=[samples];
  while(boxes.length<maxColors){
    let bi=-1,best=0;
    for(let i=0;i<boxes.length;i++){
      const bx=boxes[i];if(bx.length<2)continue;
      let mn=[255,255,255],mx=[0,0,0];
      for(const p of bx)for(let c=0;c<3;c++){if(p[c]<mn[c])mn[c]=p[c];if(p[c]>mx[c])mx[c]=p[c]}
      const score=((mx[0]-mn[0])+(mx[1]-mn[1])+(mx[2]-mn[2])+18)*bx.length;
      if(score>best){best=score;bi=i}}
    if(bi<0)break;
    const bx=boxes[bi];
    let mn=[255,255,255],mx=[0,0,0];
    for(const p of bx)for(let c=0;c<3;c++){if(p[c]<mn[c])mn[c]=p[c];if(p[c]>mx[c])mx[c]=p[c]}
    let ch=0;for(let c=1;c<3;c++)if(mx[c]-mn[c]>mx[ch]-mn[ch])ch=c;
    bx.sort((a,b)=>a[ch]-b[ch]);
    const mid=bx.length>>1;
    boxes.splice(bi,1,bx.slice(0,mid),bx.slice(mid))}
  return boxes.map(bx=>{
    let r=0,g=0,b=0;for(const p of bx){r+=p[0];g+=p[1];b+=p[2]}
    const n=bx.length||1;
    return[Math.round(r/n),Math.round(g/n),Math.round(b/n)]})}
function lzwEncode(indices,minCode){
  const clear=1<<minCode,eoi=clear+1;
  let size=minCode+1,next=eoi+1;
  const dict=new Map();
  const bytes=[];let acc=0,bits=0;
  const put=c=>{acc|=c<<bits;bits+=size;
    while(bits>=8){bytes.push(acc&255);acc>>>=8;bits-=8}};
  put(clear);
  let prev=indices[0];
  for(let i=1;i<indices.length;i++){
    const c=indices[i],key=(prev<<8)|c;
    const v=dict.get(key);
    if(v!==undefined)prev=v;
    else{
      put(prev);
      if(next===4096){put(clear);dict.clear();next=eoi+1;size=minCode+1}
      else{
        if(next>=(1<<size)&&size<12)size++;
        dict.set(key,next);next++}
      prev=c}}
  put(prev);put(eoi);
  if(bits>0)bytes.push(acc&255);
  return bytes}
function gifEncode(frames,delayMs,loop){
  const W=frames[0].w,H=frames[0].h;
  const samples=[];
  for(const f of frames)samples.push(...rgbSample(f.data,f.w,f.h,20000));
  const pal=medianCut(samples,255);
  while(pal.length<256)pal.push([0,0,0]);
  const cache=new Map();
  const nearIdx=(r,g,b)=>{
    const key=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
    let v=cache.get(key);
    if(v!==undefined)return v;
    let bi=1,bd=1e9;
    for(let i=1;i<256;i++){
      const p=pal[i],dr=r-p[0],dg=g-p[1],db=b-p[2],d=dr*dr+dg*dg+db*db;
      if(d<bd){bd=d;bi=i}}
    cache.set(key,bi);return bi};
  const out=[];
  const push=(...bs)=>{for(const b of bs)out.push(b&255)};
  const str=s=>{for(let i=0;i<s.length;i++)out.push(s.charCodeAt(i))};
  str('GIF89a');
  push(W&255,W>>8,H&255,H>>8,0xF7,0,0);
  for(const c of pal)push(c[0],c[1],c[2]);
  push(0x21,0xFF,0x0B);str('NETSCAPE2.0');push(3,1,loop&255,(loop>>8)&255,0);
  const delay=Math.max(2,Math.round(delayMs/10));
  for(const f of frames){
    push(0x21,0xF9,4,0x05,delay&255,(delay>>8)&255,0,0);
    push(0x2C,0,0,0,0,W&255,W>>8,H&255,H>>8,0);
    const idx=new Uint8Array(f.w*f.h);
    for(let i=0;i<idx.length;i++){
      const j=i*4;
      idx[i]=f.data[j+3]<128?0:nearIdx(f.data[j],f.data[j+1],f.data[j+2])}
    const lzw=lzwEncode(idx,8);
    push(8);
    for(let i=0;i<lzw.length;i+=255){
      const chunk=lzw.slice(i,Math.min(i+255,lzw.length));
      push(chunk.length);
      for(const b of chunk)push(b)}
    push(0)}
  push(0x3B);
  return Uint8Array.from(out)}

/* ---------- PSD layers EXPORT ---------- */
const PSD_BLEND_OUT={'source-over':'norm','multiply':'mul ','screen':'scrn','overlay':'over','darken':'dark','lighten':'lite',
  'difference':'diff','exclusion':'excl','hue':'hue ','saturation':'sat ','color':'colr','luminosity':'lum ',
  'hard-light':'hLit','soft-light':'sLit','color-dodge':'norm','color-burn':'norm'};
function buildPSD(layerDefs,composite,W,H){
  const out=[];const push=(...bs)=>{for(const b of bs)out.push(b&255)};
  const str=s=>{for(let i=0;i<s.length;i++)out.push(s.charCodeAt(i))};
  const u16=v=>{push((v>>8)&255,v&255)};
  const u32=v=>{push((v>>>24)&255,(v>>16)&255,(v>>8)&255,v&255)};
  str('8BPS');u16(1);push(0,0,0,0,0,0);
  u16(3);u32(H);u32(W);u16(8);u16(3);
  u32(0);u32(0);
  // ---- layer & mask ----
  const lm=[];
  const lmPush=(...bs)=>{for(const b of bs)lm.push(b&255)};
  const lmStr=s=>{for(let i=0;i<s.length;i++)lmPush(s.charCodeAt(i))};
  const lm16=v=>{lmPush((v>>8)&255,v&255)};
  const lm32=v=>{lmPush((v>>>24)&255,(v>>16)&255,(v>>8)&255,v&255)};
  lm16(layerDefs.length);
  const channelDataChunks=[];
  for(const L of layerDefs){
    const w=L.w,h=L.h;
    lm32(L.top);lm32(L.left);lm32(L.top+h);lm32(L.left+w);
    lm16(4);
    const chIds=[0,1,2,-1];
    const chans={R:L.R,G:L.G,B:L.B,A:L.A};
    for(const id of chIds){
      lm16(id<0?65535:id);
      lm32(2+w*h)}
    lmStr('8BIM');lmStr(PSD_BLEND_OUT[L.blend]||'norm');
    lmPush(L.opacity,0,L.hidden?2:0,0);
    const name=(L.name||'Layer').slice(0,26);
    const nameLen=1+name.length;
    const pad=(4-nameLen%4)%4;
    lm32(4+4+nameLen+pad+ (0)+(0)+0); // mask(4:0) + ranges(4:0) + name
    lm32(0);lm32(0);
    lmPush(name.length);lmStr(name);
    for(let k=0;k<pad;k++)lmPush(0);
    // channel data assembled after records
    const chunk=[];
    const cp=(...bs)=>{for(const b of bs)chunk.push(b&255)};
    cp(0,0);for(let i=0;i<w*h;i++)chunk.push(chans.R[i]&255);
    cp(0,0);for(let i=0;i<w*h;i++)chunk.push(chans.G[i]&255);
    cp(0,0);for(let i=0;i<w*h;i++)chunk.push(chans.B[i]&255);
    cp(0,0);for(let i=0;i<w*h;i++)chunk.push(chans.A[i]&255);
    channelDataChunks.push(chunk)}
  let chanTotal=0;

  toast('PSD (layers) export ho raha hai…');

    try{
      renderComposite();

        bakeOffset(L);
        let srcCv=L.canvas;
        if(L.mask&&L.mask.enabled){srcCv=mkCanvas(doc.w,doc.h);const sg=srcCv.getContext('2d');

        lastBaseCv=srcCv;

        defs.push({name:L.name,top:0,left:0,w:doc.w,h:doc.h,R,G,B,A,
          opacity:Math.round(clamp(L.opacity,0,1)*255),hidden:L.visible===false,blend:L.blend})}
      for(const V of vectors){

        defs.push({name:V.name+' (vector)',top:0,left:0,w:doc.w,h:doc.h,R,G,B,A,
          opacity:Math.round(clamp(V.opacity,0,1)*255),hidden:false,blend:V.blend})}
      const ci=comp.getContext('2d').getImageData(0,0,doc.w,doc.h).data;

      toast('PSD exported: '+defs.length+' layers — Photoshop/Krita/GIMP me kholo','ok',4200)}

function kPosterize(d,lev){const n=Math.max(2,lev|0),st=255/(n-1);
  for(let i=0;i<d.length;i+=4){if(d[i+3]<8)continue;
    d[i]=Math.round(Math.round(d[i]/st)*st);d[i+1]=Math.round(Math.round(d[i+1]/st)*st);d[i+2]=Math.round(Math.round(d[i+2]/st)*st)}}
function kWarm(d){for(let i=0;i<d.length;i+=4){if(d[i+3]<8)continue;
  d[i]=Math.min(255,d[i]*1.10+6);d[i+1]=Math.min(255,d[i+1]*1.02+2);d[i+2]=d[i+2]*0.92}}
function kCool(d){for(let i=0;i<d.length;i+=4){if(d[i+3]<8)continue;
  d[i]=d[i]*0.92;d[i+1]=Math.min(255,d[i+1]*1.02);d[i+2]=Math.min(255,d[i+2]*1.10+6)}}
function kDuotone(d,dr,dg,db,lr,lg,lb){for(let i=0;i<d.length;i+=4){if(d[i+3]<8)continue;
  const l=(d[i]*.299+d[i+1]*.587+d[i+2]*.114)/255;
  d[i]=dr+(lr-dr)*l;d[i+1]=dg+(lg-dg)*l;d[i+2]=db+(lb-db)*l}}

    g.save();g.imageSmoothingEnabled=true;g.clearRect(0,0,72,72);

  catch(err){toast(err.message,'err');return}
  const dur=Math.max(0.1,v.duration||1);
  modal({title:'Import Video Frames 🎬',
    body:'<div class="pnote">'+v.videoWidth+'×'+v.videoHeight+' · '+dur.toFixed(1)+'s — frames Animation Timeline me jayenge</div>'
    +'<div class="mrow"><label>FPS sample</label><input type="range" id="vfFps" min="2" max="24" value="8"><span class="rv" id="vfFpsV">8</span></div>'
    +'<div class="mrow"><label>Max frames</label><input type="range" id="vfMax" min="2" max="40" value="16"><span class="rv" id="vfMaxV">16</span></div>'
    +'<div class="pnote">Tip: bade video me frames kam rakho — memory bachegi</div>',
    buttons:[{l:'Cancel'},{l:'Import',cls:'acc',fnClose:true,fn:()=>{
      const f1=document.getElementById('vfFps'),f2=document.getElementById('vfMax');
      sampleVideoFrames(v,dur,fps2=>0,+((f1&&f1.value)||8),+((f2&&f2.value)||16))}}]});
  const r1=document.getElementById('vfFps');if(r1)r1.addEventListener('input',()=>{const s=document.getElementById('vfFpsV');if(s)s.textContent=r1.value});
  const r2=document.getElementById('vfMax');if(r2)r2.addEventListener('input',()=>{const s=document.getElementById('vfMaxV');if(s)s.textContent=r2.value})}
async function sampleVideoFrames(v,dur,fps,max){
  try{
    if(!doc)makeDoc(1280,720,'#ffffff');
    commitFloat&&commitFloat();
    pushUndo(null,'Video Frames');
    animEnsure();animStop();
    const vl=newRasterLayer('Video');
    doc.layers.push(vl);doc.activeId=vl.id;uiLayers();
    const n=Math.max(1,Math.min(max,Math.floor(dur*fps)||1));
    const step=dur/n;
    anim.frames=[];
    for(let i=0;i<n;i++){
      const t=Math.min(Math.max(0,dur-0.03),i*step);
      await new Promise(res=>{const h=()=>{v.removeEventListener('seeked',h);res()};v.addEventListener('seeked',h);v.currentTime=t});
      const c=mkCanvas(doc.w,doc.h);const g=c.getContext('2d');
      const s=Math.min(doc.w/v.videoWidth,doc.h/v.videoHeight);
      const w=v.videoWidth*s,h2=v.videoHeight*s;
      g.drawImage(v,(doc.w-w)/2,(doc.h-h2)/2,w,h2);
      const f=blankFrame();
      const cell=f.cells.find(x=>x.id===vl.id&&x.kind==='r');
      if(cell)cell.canvas=c;
      anim.frames.push(f);
      if(i%4===0)toast('Frames: '+Math.round(i/n*100)+'%…',null,900);
      await new Promise(r3=>setTimeout(r3,0))}
    anim.cur=0;applyFrame(anim.frames[0]);
    if(typeof tlEl==='undefined'||!tlEl)buildTimeline();
    if(tlEl&&tlEl.style.display==='none')toggleTimeline();
    needRender=true;docDirty=true;
    toast(n+' frames import ho gaye 🎬 — Animation timeline me dekho','ok',3600)}
  catch(err){toast('Video import: '+err.message,'err')}}
